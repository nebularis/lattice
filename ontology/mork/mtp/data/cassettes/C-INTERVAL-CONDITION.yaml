id: C-INTERVAL-CONDITION
source: ontology/mork/examples/Patterns/interval-condition.ttl
sample: ontology/mork/examples/Patterns/source-sample.ttl
side: target
focus: "a relation scoped by an interval condition: a range set on one value space, a range with an upper bound, its sense, closure and quantity"
mcn: |
  @b <https://example.org/lattice/mtp/patterns/interval-condition#>
  @p src=<https://example.org/lattice/mtp/source#>
  @p ins=<https://www.nebularis.org/neuro-semantic/lattice/instrument#>
  @p pty=<https://www.nebularis.org/neuro-semantic/lattice/party#>
  @p elg=<https://www.nebularis.org/neuro-semantic/lattice/eligibility#>
  @p qnt=<https://www.nebularis.org/neuro-semantic/lattice/quantification#>
  %R Source fm mork:RDF lb "undertakings between named parties"
  %X
  src:Undertaking RE
  %T Concepts in Source
  UndertakingConcept C ra src:Undertaking
  ByConcept C p src:by
  ToConcept C p src:to
  %M Scheme md mork:ReviewMode lb "an undertaking to an obligation scoped by an interval condition" sdl [src <https://example.org/lattice/mtp/source#>]
  Role_T MD xt pty:Role c role
  Role_T_Label M cb Role_T xr rdfs:label r src:name
  Undertaking MD f UndertakingConcept xt ins:Term,ins:Template c term
  Undertaking_Relation MD cb Undertaking xt ins:Obligation,ins:Template xr ins:arisesUnder c relation
  Undertaking_Activity M cb Undertaking_Relation xr ins:activity r src:act
  Undertaking_Obligor MD cb Undertaking_Relation tp Role_T f ByConcept xi ins:obligor
  Undertaking_Obligee MD cb Undertaking_Relation tp Role_T f ToConcept xi ins:obligee
  Undertaking_Scope MD cb Undertaking_Relation xt elg:AdmissionProfile xi ins:scope c scope
  Undertaking_Scope_Operation M cb Undertaking_Scope xr elg:compositionOperation xa elg:AllRequired
  Undertaking_Scope_Key M cb Undertaking_Scope xr elg:conditionKey v "undertaking-scope"
  Undertaking_Days MD cb Undertaking_Scope xt elg:Condition xi elg:hasCondition c days-condition
  Undertaking_Days_Key M cb Undertaking_Days xr elg:conditionKey v "days-since-order"
  Undertaking_Days_Strategy M cb Undertaking_Days xr elg:matchStrategy xa elg:IntervalContainment
  Undertaking_Days_Wildcard M cb Undertaking_Days xr elg:wildcardSemantics xa elg:NoWildcard
  Undertaking_Days_RangeSet MD cb Undertaking_Days xt qnt:RangeSet xi elg:requiredRangeSet c range-set n "An interval condition requires a range set, a union of ranges on one value space."
  Undertaking_Days_RangeSet_Space MD cb Undertaking_Days_RangeSet tp Space_T xi qnt:onSpace
  Undertaking_Days_Range MD cb Undertaking_Days_RangeSet xt qnt:Range xi qnt:hasRange c range
  Undertaking_Days_Range_Space MD cb Undertaking_Days_Range tp Space_T xi qnt:onSpace
  Undertaking_Days_Upper MD cb Undertaking_Days_Range xt qnt:Bound xi qnt:upperBound c upper-bound
  Undertaking_Days_Upper_Sense M cb Undertaking_Days_Upper xr qnt:boundSense xa qnt:Upper
  Undertaking_Days_Upper_Closure M cb Undertaking_Days_Upper xr qnt:boundClosure xa qnt:Closed n "Within thirty days includes the thirtieth."
  Undertaking_Days_Upper_Space MD cb Undertaking_Days_Upper tp Space_T xi qnt:onSpace
  Undertaking_Days_Upper_Value MD cb Undertaking_Days_Upper xt qnt:Quantity xi qnt:boundValue c value
  Undertaking_Days_Upper_Value_Space MD cb Undertaking_Days_Upper_Value tp Space_T xi qnt:onSpace
  Undertaking_Days_Upper_Value_Number M cb Undertaking_Days_Upper_Value xr qnt:numericValue r src:withinDays
  Space_T MD xt qnt:ValueSpace ct "space/days-since-order" n "One value space, named once, which every range, bound and quantity on it names."
  Space_T_Order M cb Space_T xr qnt:orderKind xa qnt:TotalOrder
