id: C-CONCEPT-CONDITION
source: ontology/mork/examples/Patterns/concept-condition.ttl
sample: ontology/mork/examples/Patterns/source-sample.ttl
side: target
focus: "a relation scoped by an admission profile with an exact condition on a concept, its kind chosen by match strategy"
mcn: |
  @b <https://example.org/lattice/mtp/patterns/concept-condition#>
  @p src=<https://example.org/lattice/mtp/source#>
  @p ins=<https://www.nebularis.org/neuro-semantic/lattice/instrument#>
  @p pty=<https://www.nebularis.org/neuro-semantic/lattice/party#>
  @p elg=<https://www.nebularis.org/neuro-semantic/lattice/eligibility#>
  %R Source fm mork:RDF lb "undertakings between named parties"
  %X
  src:Undertaking RE
  %T Concepts in Source
  UndertakingConcept C ra src:Undertaking
  ByConcept C p src:by
  ToConcept C p src:to
  %M Scheme md mork:ReviewMode lb "an undertaking to an obligation scoped by a concept condition" sdl [src <https://example.org/lattice/mtp/source#>]
  Role_T MD xt pty:Role c role
  Role_T_Label M cb Role_T xr rdfs:label r src:name
  Undertaking MD f UndertakingConcept xt ins:Term,ins:Template c term
  Undertaking_Relation MD cb Undertaking xt ins:Obligation,ins:Template xr ins:arisesUnder c relation
  Undertaking_Activity M cb Undertaking_Relation xr ins:activity r src:act
  Undertaking_Obligor MD cb Undertaking_Relation tp Role_T f ByConcept xi ins:obligor
  Undertaking_Obligee MD cb Undertaking_Relation tp Role_T f ToConcept xi ins:obligee
  Undertaking_Scope MD cb Undertaking_Relation xt elg:AdmissionProfile xi ins:scope c scope n "A relation's scope is one admission profile that composes its conditions."
  Undertaking_Scope_Operation M cb Undertaking_Scope xr elg:compositionOperation xa elg:AllRequired
  Undertaking_Scope_Key M cb Undertaking_Scope xr elg:conditionKey v "undertaking-scope"
  Undertaking_Place MD cb Undertaking_Scope xt elg:ExactCondition xi elg:hasCondition c place-condition
  Undertaking_Place_Key M cb Undertaking_Place xr elg:conditionKey v "delivery-place"
  Undertaking_Place_Strategy M cb Undertaking_Place xr elg:matchStrategy xa elg:ExactMatch n "A condition's kind is chosen by its match strategy, an individual, never by a subclass."
  Undertaking_Place_Wildcard M cb Undertaking_Place xr elg:wildcardSemantics xa elg:NoWildcard
  Undertaking_Place_Required M cb Undertaking_Place xr elg:requiredConcept r src:at
