[tools]
java = "25"
maven = "3.9"
node = "22"
python = "3.14"
erlang = "27"
elixir = "1.17"

[env]
# Each checkout, git worktrees included, gets its own .venv, so an editable install never points
# at another checkout (developer guide, "Several checkouts side by side").
_.python.venv = { path = ".venv", create = true }
MAVEN_OPTS = "-Dstyle.color=always"
PYTHONUNBUFFERED = "1"

[tasks.bootstrap]
description = "Install configured toolchains and dependency sets, and the git hooks"
depends = ["bootstrap:python", "bootstrap:frontend", "bootstrap:hooks", "bootstrap:knowledge"]

# The git hooks (ADR-A133). Warns, never fails, where a hook it did not write is already present.
[tasks."bootstrap:hooks"]
description = "Install the git hooks, warning where a hook this task did not write is present (ADR-A133)"
run = "python tools/hooks.py install --bootstrap"

# One pip, once. The Python packages share one virtual environment per checkout, so they are
# installed in a single resolve. Ten pip processes writing one site-packages at the same time
# corrupt it when two of them want different versions of a package, and pip cannot see a conflict
# between processes. A single resolve installs a consistent set or reports the conflict.
[tasks."bootstrap:python"]
description = "Install every Python package of the repository into this checkout's .venv in one resolve"
depends = ["bootstrap:pip"]
run = "python -m pip install -c requirements-lock.txt \".[reasoning,test,knowledge]\" -e \"./workers[test,authoring,studio]\" -e ./tools/mork -e \"./tools/mork_compilers[test]\" -e ./tools/surface -e \"./tools/wording_assembler[test]\" -e \"./tools/mork_rdf[test]\" -e \"./tools/mork_transforms[test]\" -e ./packages/persistence/python -e \"./tools/persistence[test]\" -e \"./tools/vocabulary[test]\" -e \"./tools/reference/eligibility[test]\" -e \"./packages/minting/python[test]\" -e \"./tools/testing/oxigraph[test]\" -e \"./tools/testing/jena[test]\" -e \"./tools/testing/sparql_probes[test]\" -e \"./tools/testing/mem_check[test]\""

# The knowledge index, after the packages it needs (ADR-A134 decision 13). The first build fetches
# the embedding model, and where that is blocked it notes why and still builds, so bootstrap never
# fails on it.
[tasks."bootstrap:knowledge"]
description = "Build the knowledge index, fetching its embedding model on first run (ADR-A134)"
depends = ["bootstrap:python"]
run = "python tools/knowledge/extract.py --quiet"

# A virtual environment that mise creates with uv has no pip. This puts one in, and does nothing
# where pip is already there.
[tasks."bootstrap:pip"]
description = "Make sure this checkout's .venv has pip"
run = "python -m ensurepip --upgrade"

[tasks."bootstrap:python-root"]
depends = ["bootstrap:pip"]
description = "Install root ontology validation dependencies"
run = "python -m pip install -c requirements-lock.txt \".[reasoning,test]\""

[tasks."bootstrap:workers"]
depends = ["bootstrap:pip"]
description = "Install the worker package with test dependencies"
run = "python -m pip install -e \"./workers[test,authoring,studio]\""

[tasks."bootstrap:mork"]
depends = ["bootstrap:pip"]
description = "Install the MORK package and MTP structural dependencies"
run = "python -m pip install -e ./tools/mork"

[tasks."bootstrap:mork-compilers"]
depends = ["bootstrap:pip", "bootstrap:vocabulary"]
description = "Install the MORK backend compiler package"
run = "python -m pip install -e \"./tools/mork_compilers[test]\""

[tasks."bootstrap:wording-assembler"]
depends = ["bootstrap:pip", "bootstrap:mork-compilers"]
description = "Install the Wording assembler package"
run = "python -m pip install -e \"./tools/wording_assembler[test]\""

[tasks."bootstrap:surface"]
depends = ["bootstrap:pip", "bootstrap:vocabulary"]
description = "Install the Surface compiler package"
run = "python -m pip install -e ./tools/surface"

[tasks."bootstrap:persistence"]
depends = ["bootstrap:pip"]
description = "Install the persistence profile compiler package (ADR-A78/A79)"
run = "python -m pip install -e ./packages/persistence/python -e \"./tools/persistence[test]\""

[tasks."bootstrap:testing-oxigraph"]
depends = ["bootstrap:pip"]
description = "Install the Oxigraph test-support package, the default engine of the persistence tests (ADR-A125)"
run = "python -m pip install -e \"./tools/testing/oxigraph[test]\""

[tasks."bootstrap:testing-jena"]
depends = ["bootstrap:pip", "bootstrap:sparql-testkit"]
description = "Build the Jena testkit jar and install the Jena test-support package, the third engine of the conformance runs (ADR-A125). Tests skip without the jar"
run = "python -m pip install -e \"./tools/testing/jena[test]\""

[tasks."check:testing-jena"]
depends = ["bootstrap:testing-jena"]
description = "Run the Jena test-support package's own tests (ADR-A125)"
run = "python -m pytest tools/testing/jena/tests -q"

[tasks."bootstrap:testing-sparql-probes"]
depends = ["bootstrap:testing-oxigraph", "bootstrap:testing-jena"]
description = "Install the engine probes package and the three engines it runs on (ADR-A125)"
run = "python -m pip install -e \"./tools/testing/sparql_probes[test]\""

[tasks."check:sparql-probes-conformance"]
depends = ["bootstrap:testing-sparql-probes"]
description = "Run the engine probes (the aggregate-over-an-error matrix, TSD-43) on rdflib, Oxigraph and Jena ARQ, with Jena executed, and the Jena package's own tests. Run on demand and before a merge into main, not part of check (ADR-A125). SPARQL_PROBES_REQUIRED=1 fails where an engine is missing instead of skipping it"
run = "python -m pytest tools/testing/sparql_probes/tests tools/testing/jena/tests -q"
env = { SPARQL_PROBES_REQUIRED = "1" }

[tasks."check:conformance"]
description = "Run every conformance task in turn, so one command checks every engine before a merge into main (ADR-A125, MSC-Q5). Each task is on demand and none is part of check. Add a conformance task here when a suite gains one"
run = [
  { task = "check:persistence-conformance" },
  { task = "check:mork-compilers-conformance" },
  { task = "check:reference-eligibility-conformance" },
  { task = "check:sparql-probes-conformance" },
]

[tasks."bootstrap:testing-mem-check"]
depends = ["bootstrap:pip"]
description = "Install mem_check, which says how much memory is available and how many test workers fit in it (ADR-A125). Standard library only"
run = "python -m pip install -e \"./tools/testing/mem_check[test]\""

[tasks."check:testing-mem-check"]
depends = ["bootstrap:testing-mem-check"]
description = "Run mem_check's tests (ADR-A125)"
run = "python -m pytest tools/testing/mem_check/tests -q"

[tasks."bootstrap:vocabulary"]
depends = ["bootstrap:pip"]
description = "Install the Vocabulary scoped/temporal binding reference resolver (ADR-A85)"
run = "python -m pip install -e \"./tools/vocabulary[test]\""

[tasks."bootstrap:reference-eligibility"]
depends = ["bootstrap:pip", "bootstrap:mork-compilers"]
description = "Install Eligibility's hand-written reference semantics (formal-methods track B1/B2, ADR-A-FM3)"
run = "python -m pip install -e \"./tools/reference/eligibility[test]\""

[tasks."bootstrap:frontend"]
description = "Install the Yarn workspace through Corepack"
run = "corepack enable && yarn install --immutable"

[tasks.check]
description = "Run all repository validation tasks"
depends = ["check:python-root", "check:workers", "check:java", "check:frontend", "check:spc", "check:persistence", "check:vocabulary", "check:reference-eligibility", "check:mork-compilers", "check:mork-rdf", "check:mork-transforms", "check:wording-assembler", "check:mork", "check:ontology-versioning", "check:ontology-catalog", "check:import-guard", "check:owl-profile", "check:reasoning-isolation", "check:minting", "check:persistence-library", "check:formal-freshness", "check:catalogue", "check:identifiers", "check:knowledge", "check:agent-guidance", "build:mtp", "check:mtp", "check:published-decisions", "check:site-sections", "check:hooks"]

[tasks.test]
description = "Run the repository test suites"
depends = ["check", "test:frontend"]

[tasks."topology:preflight"]
description = "Check ADR-A77 topology migration prerequisites"
run = "python tools/repository_topology_check.py"

[tasks."topology:ready"]
description = "Check prerequisites for moving semantic roots into ontology"
run = "python tools/repository_topology_check.py --ready"

[tasks."topology:links"]
description = "Check local Markdown links under docs"
run = "python tools/repository_topology_check.py --links"

[tasks."check:python-root"]
run = "python -m unittest surface.test_surface mork_compilers.test_mork_compilers -v && python -m tools.phase8_conformance"

[tasks."check:workers"]
run = "python -m pytest workers/tests"

[tasks."check:mtp"]
description = "Check the committed MORK Teaching Pack structure and pins"
run = "python -m mtp.cli check --out ontology/mork/mtp/out"

[tasks."build:mtp"]
description = "Regenerate committed MORK Teaching Pack output"
run = "python -m mtp.cli facts-report; python -m mtp.cli build --out ontology/mork/mtp/out"

[tasks."check:java"]
run = "mvn -f platform/pom.xml verify"

[tasks."check:frontend"]
run = "yarn check"

[tasks."check:authoring-domain"]
description = "Type-check and unit-test the authoring domain package shared by the add-in and the studio"
run = "yarn workspace @lattice/authoring-domain run check"

[tasks."check:authoring-addin"]
description = "Type-check and unit-test the Word authoring add-in"
depends = ["check:authoring-domain"]
run = "yarn workspace @lattice/word-authoring-addin run check"

[tasks."test:authoring-addin"]
description = "Type-check, unit-test and run the harness tests of the Word authoring add-in"
depends = ["check:authoring-addin"]
run = "yarn workspace @lattice/word-authoring-addin run test"

[tasks."test:frontend"]
run = "yarn test"

[tasks."check:spc"]
run = "cd tools/spc/erlang && mix test"

[tasks."check:minting-anchors"]
description = "Recompute every identity-minting anchor vector with openssl and the Python standard library, sharing no code with the minting libraries (ADR-A84)"
run = "python contracts/identity/verify-anchors.py"

[tasks."bootstrap:minting-python"]
depends = ["bootstrap:pip"]
description = "Install the standalone Python minting library (ADR-A84) with its test extra"
run = "python -m pip install -e \"./packages/minting/python[test]\""

[tasks."mork:propose"]
description = "Run one MORK mapping proposal tool from the command line, as the MCP server offers it: teaching-pack, target-cards, source-cards, candidates or check. mise run mork:propose -- --help lists them"
env = { PYTHONPATH = "{{config_root}}/tools" }
run = "python -m mork_propose.cli"

[tasks."mork:propose-trial"]
description = "Score a mapping proposal run against a reference pack and record it, with the pack's review of each mapping, in a proposal history: mise run mork:propose-trial -- <run folder> --pack <pack> --pack-scheme <IRI> --history <file> [--sample <file>]"
env = { PYTHONPATH = "{{config_root}}/tools" }
run = "python -m mork_propose.trial"

[tasks."mork:propose-mcp"]
description = "Serve the MORK mapping proposal tools over MCP on standard input and output, for an agent such as Claude Desktop: the teaching pack and codebook, cards of LATTICE's layers and of a source vocabulary, candidate target terms, and the check of a proposal in MCN"
raw = true  # an MCP host speaks over the task's own standard input and output
env = { PYTHONPATH = "{{config_root}}/tools" }
run = "python -m mork_propose.server"

[tasks."check:mork"]
description = "Run the MORK tooling's tests under tools/mork/src, the compiler agent's among them"
run = "python -m pytest tools/mork/src -q"

[tasks."check:minting-python"]
description = "Run the Python minting library against the anchors, the generated vectors and the Unicode 16.0 cross-checks"
run = "python -m pytest packages/minting/python/tests -q"

[tasks."check:minting-java"]
description = "Build the standalone Java minting library and run it against the anchors, the generated vectors and the Unicode 16.0 table checks"
run = "mvn -q -f packages/minting/java/pom.xml verify"

[tasks."check:minting"]
description = "Check both identity minting libraries and the anchor vectors (the table check, which downloads the UCD, is check:minting-tables)"
depends = ["check:minting-anchors", "check:minting-python", "check:minting-java"]

[tasks."check:persistence-vectors"]
description = "Recompute every persistence conformance vector (canonical N-Triples and request digests) with openssl and the Python standard library, sharing no code with the caller library (ADR-A132 decision 4)"
run = "python contracts/persistence/verify-vectors.py"

[tasks."bootstrap:persistence-library"]
depends = ["bootstrap:pip"]
description = "Install the persistence caller library (ADR-A132) with its test extra"
run = "python -m pip install -e \"./packages/persistence/python[test]\""

[tasks."check:persistence-library"]
depends = ["check:persistence-vectors"]
description = "Run the persistence caller library against the conformance vectors in contracts/persistence and its own tests (ADR-A132)"
run = "python -m pytest packages/persistence/python/tests -q"

[tasks."build:persistence-execution"]
description = "Compile every ontology/persistence example and write its SPARQL and minting recipes to ontology/persistence/execution (generated, ignored by git)"
run = """
set -e
t=$(mktemp -d)
out=ontology/persistence/execution
rm -rf "$out"/*/
for f in ontology/persistence/examples/*.ttl; do
  n=$(basename "$f" .ttl)
  args="$f"
  if [ "$n" = capability-spec-example ]; then args="ontology/persistence/examples/baseline-single-class.ttl --capability-spec $f"; fi
  mkdir -p "$out/$n"
  if python -m persistence compile ontology/persistence/spec/persistence.ttl $args --out "$t/$n.ttl" > "$t/$n.log" 2>&1; then
    python -m persistence instantiate "$t/$n.ttl" --out "$out/$n/sparql" > /dev/null 2>&1
    python -m persistence export-recipes "$t/$n.ttl" --out "$out/$n/recipes" > /dev/null 2>&1 || true
    rmdir "$out/$n/recipes" 2> /dev/null || true
  else
    sed -e "s|$t/||g" "$t/$n.log" > "$out/$n/refused.txt"
  fi
done
rm -rf "$t"
"""

[tasks."build:minting-vectors"]
description = "Compile the identity-minting anchor and coverage fixtures and regenerate the committed recipes and conformance vectors in packages/minting/testdata"
run = """
t=$(mktemp -d)
python -m persistence compile ontology/persistence/spec/persistence.ttl ontology/persistence/examples/identity-minting-anchors.ttl ontology/persistence/examples/identity-minting-coverage.ttl --out "$t/compiled.ttl"
rm -f packages/minting/testdata/*.recipe.json packages/minting/testdata/*.vectors.json
python -m persistence export-recipes "$t/compiled.ttl" --vectors --out packages/minting/testdata
rm -rf "$t"
"""

[tasks."check:minting-tables"]
description = "Regenerate the pinned Unicode 16.0 tables from the UCD and fail if the committed copies differ"
run = "python packages/minting/tools/generate_ucd_tables.py --check"

[tasks."check:persistence"]
depends = ["check:persistence-expected-profiles"]
description = "Run the persistence profile compiler test suite (resolver, validator, capability, injection corpus, determinism). Oxigraph is the default engine for the tests that run generated SPARQL, and conformance tests (one engine's behaviour, such as rdflib's hash-seed sweeps) run separately in check:persistence-conformance (ADR-A125). Also runs the Oxigraph adapter's own tests. Parallelised by test with -n auto --dist loadgroup (FMH-TS-1): the witness-coverage module is one group, since its tests share one slow corpus run. PYTEST_XDIST_AUTO_NUM_WORKERS sets what auto means, e.g. on a machine whose efficiency cores add nothing"
run = "python -m pytest tools/testing/oxigraph/tests tools/persistence/tests -q -n auto --dist loadgroup -m \"not conformance\""
env = { PERSISTENCE_ENGINES_REQUIRED = "1" }

[tasks."check:persistence-conformance"]
depends = ["bootstrap:testing-jena"]
description = "Run the persistence tests on every engine we have (rdflib, Oxigraph and Jena ARQ in memory) and the conformance tests that check:persistence leaves out: the generated SPARQL on rdflib, the hash-seed sweeps and the probes of each engine's behaviour (ADR-A125). Run on demand and before a merge into main, not part of check. A new engine is added to PERSISTENCE_ENGINES here"
run = "python -m pytest tools/testing/oxigraph/tests tools/persistence/tests -q -n auto --dist loadgroup"
env = { PERSISTENCE_ENGINES = "rdflib,oxigraph,jena", PERSISTENCE_ENGINES_REQUIRED = "1" }

[tasks."check:persistence-expected-profiles"]
description = "Check that the expected compiled profiles under ontology/persistence/test/expected-profiles are what the builders and compile give now (formal-methods H2.6). Fails with the names of the stale files. Part of check:persistence"
run = "python tools/persistence/tests/expected_profiles.py --check"

[tasks."build:persistence-expected-profiles"]
description = "Regenerate the expected compiled profiles under ontology/persistence/test/expected-profiles, after a change to a builder or to compile output, in the same commit"
run = "python tools/persistence/tests/expected_profiles.py --write"

[tasks."build:persistence-builder-goldens"]
description = "Record the version and a digest of the text each persistence builder renders, after bumping BUILDER_VERSIONS in persistence/contract.py. Refuses a changed text under an unchanged version"
run = "python tools/persistence/tests/builder_goldens.py --update"

[tasks."build:persistence-membership-fixtures"]
description = "Regenerate the TriG fixtures of E5 and E7 under each membership encoding in ontology/persistence/test/membership (formal-methods H2.6f), after a change to the append-version builders"
run = "python tools/persistence/tests/membership_fixtures.py --write"

[tasks."check:persistence-membership"]
depends = ["bootstrap:testing-oxigraph"]
description = "Measure full, delta and in-place-with-patch-log membership on rdflib and Oxigraph (ADR-A124, formal-methods H2.6f). Run on demand, not part of check. Fails on a wrong count, never on time. MEMBERSHIP_COST_MAX caps the versions"
run = "python -m pytest benchmark/persistence-membership -q -p no:cacheprovider && python benchmark/persistence-membership/check.py"

[tasks."check:persistence-store-probes"]
depends = ["bootstrap:testing-oxigraph"]
description = "Measure what a graph variable bound outside an OPTIONAL costs on rdflib, Oxigraph and Jena when it is available, in four forms, per engine version (ADR-A124, TSD-42, TSD-Q22). Run on demand, not part of check. Fails on a wrong count, never on time. STORE_PROBES_QUICK=1 uses a smaller store"
run = "python -m pytest benchmark/persistence-store-probes -q -p no:cacheprovider && python benchmark/persistence-store-probes/check.py"

[tasks."check:persistence-composite-cost"]
depends = ["bootstrap:testing-oxigraph"]
description = "Measure the composite replace on rdflib and Oxigraph (ADR-A124, TD-42). Run on demand, not part of check. Fails on a wrong result, never on time. COMPOSITE_COST_MAX caps the size"
run = "python -m pytest benchmark/persistence-composite-cost -q -p no:cacheprovider && python benchmark/persistence-composite-cost/check.py"

[tasks."check:persistence-graph-naming-cost"]
depends = ["bootstrap:testing-oxigraph"]
description = "Measure a GRAPH ?g inside an OPTIONAL, and the generated named-graph replace with the query and caller graph naming, on rdflib and Oxigraph (ADR-A124, TSD-04, TSD-42, PDD-17). Run on demand, not part of check. Fails on a wrong result, never on time. GRAPH_NAMING_MAX caps the ballast in quads, GRAPH_NAMING_QUICK=1 runs the smallest sizes"
run = "python -m pytest benchmark/persistence-graph-naming-cost -q -p no:cacheprovider && python benchmark/persistence-graph-naming-cost/check.py"

[tasks."check:persistence-graph-naming-cost-jvm"]
depends = ["bootstrap:persistence"]
description = "Measure a GRAPH ?g inside an OPTIONAL, and the generated named-graph replace with the query and caller graph naming, on Jena (in-memory and TDB2) and RDF4J (ADR-A124, TSD-42, PDD-17). Python renders the operations and the JVM runs them. Run on demand, not part of check. Fails on a wrong result, never on time. Add -Dgraphnaming.max=<quads> or -Dgraphnaming.quick=1 to the mvn command to shorten it"
run = "python benchmark/persistence-graph-naming-cost/check.py --emit benchmark/persistence-graph-naming-cost/operations.json && mvn -q -f benchmark/persistence-graph-naming-cost-jvm/pom.xml compile exec:exec"

[tasks."check:sparql-constraint-query-cost"]
depends = ["bootstrap:testing-oxigraph"]
description = "Measure the forms of a SHACL-SPARQL constraint query on rdflib, Oxigraph and Jena when its test kit is built (ADR-A124, ADR-A128, TSD-Q18). Run on demand, not part of check. Fails on a wrong result, never on time. SPARQL_COST_QUICK=1 runs the smallest sizes"
run = "python -m pytest benchmark/sparql-constraint-query-cost -q -p no:cacheprovider && python benchmark/sparql-constraint-query-cost/check.py"

[tasks."check:ledger-graph-partition"]
depends = ["bootstrap:testing-oxigraph"]
description = "Measure what a finer graph partition costs, by holding the events fixed and shortening the closing period so the named graphs multiply (ADR-A124, MS-Q9). Run on demand, not part of check. Fails on a wrong balance or an impossible graph count, never on time. LEDGER_SWEEP_EVENTS sets the events, LEDGER_SWEEP_QUICK=1 runs the coarsest three intervals"
run = "python benchmark/ledger-posting-cost/sweep.py"

[tasks."check:ledger-cross-family"]
depends = ["bootstrap:testing-oxigraph"]
description = "Measure whether an as-of read whose range crosses a change of closing recurrence stays flat in the history, against same-width reads inside one graph family and against the unpartitioned fold (ADR-A124, PDD-12). Run on demand, not part of check. Fails on a wrong balance, stored count or folded total, never on time. LEDGER_CROSS_MAX caps the events, LEDGER_CROSS_QUICK=1 runs the smallest size"
run = "python -m pytest benchmark/ledger-posting-cost/test_cross_family.py -q -p no:cacheprovider && python benchmark/ledger-posting-cost/cross_family.py"

[tasks."check:ledger-late-posting"]
depends = ["bootstrap:testing-oxigraph"]
description = "Measure whether a read as of an effective position stays flat in the history where postings are recorded after they take effect, against the as-of-recorded read and the unpartitioned fold, across history size, late-posting rate and how far back a posting reaches (ADR-A124, PDD-14, STD-278). Run on demand, not part of check. Fails on a wrong balance, stored count, folded total or a forward-dated posting, never on time. LEDGER_LATE_MAX caps the events, LEDGER_LATE_QUICK=1 runs the smallest size"
run = "python -m pytest benchmark/ledger-posting-cost/test_late_posting.py -q -p no:cacheprovider && python benchmark/ledger-posting-cost/late_posting.py"

[tasks."check:ledger-store-comparison"]
description = "Measure whether the ledger's period-graph partition bounds an aggregate read on Jena TDB2 as it does on Oxigraph, so the result is a property of naming the graphs rather than of one engine (ADR-A124, STD-176). Run on demand, not part of check. Fails on a wrong balance, never on time. -Dledger.store.max caps the events"
run = "mvn -q -f benchmark/ledger-store-comparison/pom.xml exec:java"

[tasks."check:mork-rdf-run-cost"]
description = "Measure a MORK run's peak memory and time on the catalogue mapping over 10,000 and 100,000 synthetic records, kept in memory and streamed to a sink (ADR-A124, MP-Q1). Run on demand, not part of check. Fails on a wrong count, never on time or memory. MORK_RUN_COST_QUICK=1 runs 2,000 records, MORK_RUN_COST_LARGE=1 adds 1,000,000, which needs about 15 GB"
env = { PYTHONPATH = "{{config_root}}/tools" }
run = "python -m pytest benchmark/mork-rdf-run-cost -q -p no:cacheprovider && python benchmark/mork-rdf-run-cost/check.py"

[tasks."mork:communities-baseline"]
description = "Write contracts/config-studio/communities-baseline.ttl: section observations, communities and projections drawn from the ODRL pack and the mappings the ODRL and LegalRuleML trials' reviews accepted (MORK README §5.18). Deterministic for the same reviews"
env = { PYTHONPATH = "{{config_root}}/tools" }
run = "python -m mork_propose.baseline"

[tasks."check:mork-candidate-ranking"]
description = "Measure how often BM25, BM25 with MTP's translation table, MORK's recognition engine and the two fused put the confirmed target term in their first five and first ten, on the ODRL pack and the LegalRuleML history (ADR-A124). Run on demand, not part of check. Fails on a source with no confirmed pair or a method that ranks nothing, never on a hit rate"
env = { PYTHONPATH = "{{config_root}}/tools" }
run = "python -m pytest benchmark/mork-candidate-ranking -q -p no:cacheprovider && python benchmark/mork-candidate-ranking/check.py"

[tasks."check:ledger-posting-cost"]
depends = ["bootstrap:testing-oxigraph"]
description = "Measure the storage and read cost of recording a draw on an account tree five ways on Oxigraph (ADR-A124): at every level, at the drawn account only, with checkpoints, with a running balance, and with each period's postings in a named graph. Run on demand, not part of check. Fails on a wrong balance or count, never on time. LEDGER_COST_MAX caps the events, LEDGER_COST_QUICK=1 runs the smallest size, LEDGER_COST_PROBE=N runs one size of its own"
run = "python -m pytest benchmark/ledger-posting-cost -q -p no:cacheprovider && python benchmark/ledger-posting-cost/check.py"

[tasks."check:vocabulary"]
description = "Run the Vocabulary scoped/temporal binding conformance package (SHACL fixtures, resolver, determinism, consumer boundary; ADR-A85)"
run = "python -m pytest tools/vocabulary/tests -q"

[tasks."check:reference-eligibility"]
description = "Run Eligibility's hand-written reference semantics and its differential tests against tools/mork_compilers (kernel, denotation, laws L9-L16; formal-methods track B1/B2, ADR-A-FM3)"
run = "python -m pytest tools/reference/eligibility/tests -q"

[tasks."check:reference-eligibility-conformance"]
description = "Run Eligibility's differential tests on rdflib and on Jena (MSC-3). They run the compilers' generated SPARQL through mork_compilers.engines, so MORK_SPARQL_ENGINE picks the engine. check:reference-eligibility keeps Oxigraph. Run on demand and before a merge into main, not part of check (ADR-A125)"
depends = ["bootstrap:testing-jena"]
run = [
  { task = "check:reference-eligibility-conformance:rdflib" },
  { task = "check:reference-eligibility-conformance:jena" },
]

[tasks."check:reference-eligibility-conformance:rdflib"]
description = "Eligibility's tests with the compilers' SPARQL on rdflib (part of check:reference-eligibility-conformance)"
run = "python -m pytest tools/reference/eligibility/tests -q"
env = { MORK_SPARQL_ENGINE = "rdflib" }

[tasks."check:reference-eligibility-conformance:jena"]
description = "Eligibility's tests with the compilers' SPARQL on Jena ARQ (part of check:reference-eligibility-conformance)"
depends = ["bootstrap:testing-jena"]
run = "python -m pytest tools/reference/eligibility/tests -q"
env = { MORK_SPARQL_ENGINE = "jena" }

[tasks."check:formal-freshness"]
description = "Check every tools/proofs/<layer>/Kernel.thy and tools/reference/<layer>/ law-coverage still matches its layer's literate README (formal-methods epic, epic principle E1)"
run = "python tools/check_formal_freshness.py"

[tasks."build:agent-guidance"]
description = "Write AGENTS.md's Where things are table from the repository catalogue, then .github/copilot-instructions.md from AGENTS.md (ADR-A117, ADR-A121)"
run = "python tools/agent_guidance.py build"

[tasks."check:literate-migration"]
description = "Check a module's README migration to the ADR-A126 layout left every generated graph as it was at a git ref: mise run check:literate-migration -- <module> <ref> [--reconciliations <file>] (OD-D9)"
run = "python tools/literate_migration_check.py"

[tasks."release:prepare"]
description = "Move every release member's documents, imports and READMEs to a new release number, then regenerate the XML catalogs and the release register: mise run release:prepare -- <X.Y.Z> (OD-D55)"
run = "python tools/ontology_release.py prepare"

[tasks."build:published-decisions"]
description = "Write docs/architecture/published-architecture-decisions.md from the ADRs' Status and Described in lines (ADR-A127)"
run = "python tools/published_decisions.py build"

[tasks."check:published-decisions"]
description = "Check the published decisions list is current, every published ADR meets ADR-A127, and user-facing documents cite only published decisions and no working document"
run = "python tools/published_decisions.py check && python tools/sources_check.py --quiet && python -m pytest tools/test_published_decisions.py -q"

[tasks."build:site-sections"]
description = "Copy each site section's sources from outside docs/ into docs/_includes/<section>/ and write the sections' layouts into docs/_config.yml (OD-D29, TD-50)"
run = "python tools/site_sections.py build"

[tasks."check:site-sections"]
description = "Check the site's section copies and layouts are current, every section page exists and shows its sources, and the tests (OD-D29)"
run = "python tools/site_sections.py check && python -m pytest tools/test_site_sections.py -q"

[tasks."check:catalogue"]
description = "Check the repository catalogue against the tree: every listed module's entry, roles and extracted files, every module on disk listed, the roots, documentation areas and tool packages declared, and the bypass scan of tools (ADR-A121)"
run = "python tools/lattice_repo_catalogue.py check"

[tasks."check:identifiers"]
description = "Check every stable identifier a working document mentions resolves to a definition: decisions by filename, register entries by row, with tools/knowledge/identifier-exceptions.txt as the baseline"
run = "python tools/knowledge/identifiers.py && python -m pytest tools/knowledge/test_identifiers.py -q"

[tasks."build:knowledge"]
description = "Derive the knowledge index from the working documents and ontologies into .build/knowledge (ADR-A134). Never committed, rebuilt in about two seconds"
run = "python tools/knowledge/extract.py"

[tasks."graph:ask"]
description = "Ask the knowledge index a question: find <words> [--kind --phase --audience], read <id>, node <id>, reaches <id>, exists <text>, sparql <query>, misses [--near], gap <what reading found> [id] [path:line], or close <id>. Opens the store read-only and exits, with no resident process (TSD-38)"
run = "python tools/knowledge/ask.py"

[tasks."check:knowledge"]
description = "Check the knowledge index: the T-Box honours ADR-A134, every facet tag is a value of its scheme, and the extractor derives every node with a claim and a pointer from the real corpus, including the gerund-to-noun bridge the index exists for"
run = "python -m pytest tools/knowledge/test_vocabulary.py tools/knowledge/test_quanta.py tools/knowledge/test_extract.py tools/knowledge/test_embed.py tools/knowledge/test_facets.py tools/knowledge/test_ask.py -q"

[tasks."check:agent-guidance"]
description = "Check AGENTS.md's Where things are table is current, Copilot's file matches AGENTS.md, every skill is well formed and listed, the plugin marketplace is right, and every link resolves (ADR-A117)"
run = "python tools/agent_guidance.py check && python -m pytest tools/test_agent_guidance.py -q"

[tasks."skills:link"]
description = "Link LATTICE's skills into ~/.copilot/skills for Copilot in other projects (copies on Windows). Re-run after pulling. Pass --target for another directory"
run = "python tools/agent_guidance.py link"

[tasks."check:deny-terms"]
description = "Check staged changes against your personal deny-list, never published (skill lattice-publication-hygiene). Pass --all to scan every tracked file"
run = "python tools/deny_terms.py"

[tasks."hooks:install"]
description = "Install the git hooks into the shared hooks directory, covering every worktree: the checks a change needs at a commit and at a merge into main, never at a push (ADR-A133)"
run = "python tools/hooks.py install"

[tasks."hooks:run"]
description = "Run the commit checks over what is staged, as the pre-commit hook does (ADR-A133)"
run = "python tools/hooks.py run pre-commit"

[tasks."hooks:merge"]
description = "Run the merge checks for the current branch against main, as a merge into main does, for example before merging on GitHub (ADR-A133)"
run = "python tools/hooks.py merge"

[tasks."check:hooks"]
description = "Test the hooks dispatcher and the writing rules (ADR-A133)"
run = "python -m pytest tools/test_hooks.py tools/test_writing_rules.py -q"

[tasks."check:mork-compilers"]
description = "Run the MORK backend compiler tests, including generated SPARQL executed against fixtures (ADR-A24, ADR-A89). Oxigraph is the default engine (STD-153), since the whole suite, the reasoner tests included, passed on both engines first (STD-274, 2026-10-27). check:mork-compilers-conformance runs the same suite on rdflib. -n auto sizes its workers with mem_check (tools/conftest.py, shared with check:ontology-catalog)"
run = "python -m pytest tools/mork_compilers -q -n auto"
env = { MORK_SPARQL_ENGINE = "oxigraph" }

[tasks."bootstrap:mork-rdf"]
depends = ["bootstrap:pip"]
description = "Install the MORK RDF-to-RDF compiler package"
run = "python -m pip install -e \"./tools/mork_rdf[test]\""

[tasks."check:mork-rdf"]
description = "Run the MORK RDF-to-RDF compiler's tests: property paths, every construct of the catalogue example, the checks, determinism over shuffled inputs, rdflib against Oxigraph, time and governance, and one refusal per code. Needs the package installed, which bootstrap:python does"
run = "python -m pytest tools/mork_rdf -q"

[tasks."check:wording-assembler"]
description = "Run the Wording assembler's tests: the baseline model's decisions, slots, optional elements, determinism (WA5), refusal without a record (WA6), re-assembly and the rendered document (ADR-A139, ADR-A140). Needs the package installed, which bootstrap:python does"
run = "python -m pytest tools/wording_assembler -q"
[tasks."check:mork-compilers-conformance:rdflib"]
description = "Run the MORK backend compiler tests on rdflib. Part of check:mork-compilers-conformance, so a query that depends on one engine's reading of the specification stays visible (TSD-41)"
run = "python -m pytest tools/mork_compilers -q -n auto"
env = { MORK_SPARQL_ENGINE = "rdflib" }

[tasks."check:mork-compilers-conformance:jena"]
description = "Run the MORK backend compiler tests on Apache Jena ARQ, through the test kit of tools/testing/jena (MSC-3). Part of check:mork-compilers-conformance. Fails where the kit is not built, since a silent skip would pass the run without Jena"
depends = ["bootstrap:testing-jena"]
run = "python -m pytest tools/mork_compilers -q -n auto"
env = { MORK_SPARQL_ENGINE = "jena" }

[tasks."check:mork-compilers-conformance"]
description = "Run the MORK backend compiler tests on rdflib and on Jena, one task per engine. Run on demand and before a merge into main, not part of check (ADR-A125). check:mork-compilers keeps Oxigraph"
run = [
  { task = "check:mork-compilers-conformance:rdflib" },
  { task = "check:mork-compilers-conformance:jena" },
]
[tasks."check:ontology-versioning"]
description = "Flag any ontology .ttl file changed without its owl:versionIRI, any shapes/projection file changed without its directory's .version, a missing version, or a current version with no release row (ADR-A86)"
run = "python tools/ontology_version_check.py && python tools/ontology_releases.py check"

[tasks."build:ontology-releases"]
description = "Add a row to docs/architecture/ontology-releases.md for each unreleased ontology version, and list the release tags a person must create (ADR-A86)"
run = "python tools/ontology_releases.py write"

[tasks."check:owl-profile"]
description = "Check every ontology document against the structural part of the OWL 2 DL profile: reserved vocabulary redeclared, a class used as a predicate, an IRI of two property kinds, with tools/owl-profile-exceptions.txt as the baseline"
run = "python tools/owl_profile.py && python -m pytest tools/test_owl_profile.py -q"

[tasks."check:import-guard"]
description = "Fail when a substrate layer imports or names a layer above it, or a sibling (ADR-A01 addendum, law B7)"
run = "python tools/import_guard.py"

[tasks."build:ontology-catalog"]
description = "Regenerate ontology/catalog-v001.xml and the spec/vocab stub catalogs (ADR-A88)"
run = "python tools/ontology_catalog.py write"

[tasks."check:full-sweep"]
description = "Run every check an ontology change needs, one line each, failures in red with their failing tests, full logs in .build/full-sweep. Versions are compared with main, or pass -- --base-ref REF"
run = "python tools/full_sweep.py"

[tasks."dev:guardrail-scan"]
description = "Report the lines under platform, workers, packages and apps that may join a string into SPARQL (PRI-55) or read the wall clock (PRI-56). Report only, it never fails: mise run dev:guardrail-scan [-- --tests] (TD-85)"
run = "python tools/guardrail_scan.py"

[tasks."dev:time-ontology-tests"]
description = "Profile check:ontology-catalog as one real run, slowest files and tests first, or with -- --per-file one process per file to find a hung file (python-test-melting, TM0)"
run = "python tools/time_ontology_tests.py"

[tasks."dev:record-validations"]
description = "Run check:ontology-catalog's tests and record every SHACL validation they make (shapes, data, report) to a directory, to replay after a change to a shape or a validator (docs/architecture/efficient-queries-and-shapes.md, R7)"
run = "python tools/validation_replay.py record"

[tasks."dev:replay-validations"]
description = "Replay a recording from dev:record-validations against the shapes in the working tree and report any validation whose report differs. --write-baseline FILE saves the cases that do not reproduce on the old shapes, --baseline FILE ignores them"
run = "python tools/validation_replay.py replay"

[tasks."check:ontology-catalog"]
description = "Run the ontology tool tests (catalog, versioning, Eligibility examples, PROV-O alignment, Wording, Behaviour split, Instrument with its regimes and terms in time), then fail when a catalog drifts, an import does not resolve, or a known defect is fixed but still listed (ADR-A88). Parallelised by test with --dist worksteal (python-test-melting, TM7): the shared, cached graphs in tools/conftest.py are per-worker-process, not global, so each worker parses what it needs. Measured on two machines, worksteal was 9 to 11 percent faster than the per-file --dist loadfile it replaces, because the largest file no longer sets a floor on the run. PYTEST_XDIST_AUTO_NUM_WORKERS sets what auto means, e.g. on a machine whose efficiency cores add nothing. tools/test_peril_vocabulary.py is included again (TD-45): under test-level distribution it adds about 22s on four cores, and no longer sets a floor on the run. `mise run check:peril-vocabulary` still runs it alone"
run = "python -m pytest tools/test_applied_shared_contracts.py tools/test_eligibility_examples.py tools/test_exposure_ontology.py tools/test_lattice_repo_catalogue.py tools/test_literate_extract.py tools/test_literate_grammar.py tools/test_literate_migration_check.py tools/test_mork_order_relations.py tools/test_ontology_catalog.py tools/test_ontology_releases.py tools/test_ontology_version_check.py tools/test_peril_intensity.py tools/test_peril_vocabulary.py tools/test_provenance_alignment.py tools/test_reasoning_isolation.py tools/test_substrate_extensions.py tools/test_wording.py tools/test_behaviour_split.py tools/test_import_guard.py tools/test_behaviour_records.py tools/test_behaviour_nested.py tools/test_keys.py tools/test_instrument.py tools/test_regimes.py tools/test_terms_in_time.py tools/test_constitutive_terms.py tools/test_parameter_bindings.py tools/test_amendments.py tools/test_graph_cache.py tools/test_repo_files.py tools/test_environment_banner.py tools/test_reasoning_stalled_import.py tools/test_reasoning_jvm_options.py tools/test_reasoning_server.py tools/test_additivity.py tools/test_legal_acts.py tools/test_full_sweep.py tools/test_python_requirements.py tools/test_closures.py tools/test_validation_replay.py tools/test_ledger.py tools/test_structural_standards.py tools/test_guardrail_scan.py -q -n auto --dist worksteal && python tools/ontology_catalog.py check"

[tasks."check:peril-vocabulary"]
description = "tools/test_peril_vocabulary.py alone (TD-45), spread over workers by test. It is part of check:ontology-catalog, so this is only for running it by itself"
run = "python -m pytest tools/test_peril_vocabulary.py -q -n auto"

[tasks."bootstrap:reasoning-testkit"]
description = "Build the test-only reasoning harness jar (ADR-A83). Tests that need it skip without it"
run = "mvn -q -f platform/pom.xml -pl reasoning-testkit -am package -DskipTests"

[tasks."check:reasoning-testkit"]
description = "Run the reasoning harness self-tests (ADR-A83)"
run = "mvn -q -f platform/pom.xml -pl reasoning-testkit -am verify"

[tasks."bootstrap:sparql-testkit"]
description = "Build the test-only Jena ARQ harness jar, the engine of tools/testing/jena (ADR-A125). Tests that need it skip without it"
run = "mvn -q -f platform/pom.xml -pl sparql-testkit -am package -DskipTests"

[tasks."check:sparql-testkit"]
description = "Run the Jena harness self-tests and build its jar (ADR-A125)"
run = "mvn -q -f platform/pom.xml -pl sparql-testkit -am verify"

[tasks."bootstrap:mork-transforms"]
description = "Build the MORK transform backends jar, Saxon-HE for XSLT and Bazaarvoice JOLT for JOLT chains (ADR-A148). Tests that need it skip without it"
run = "mvn -q -f platform/pom.xml -pl mork-transforms -am package -DskipTests"

[tasks."check:mork-transforms"]
description = "Run the MORK transform backends' tests: the engines' own, then each example compiled and run on Saxon-HE and JOLT (ADR-A148)"
depends = ["bootstrap:mork-transforms"]
run = ["mvn -q -f platform/pom.xml -pl mork-transforms -am verify", "python -m pytest tools/mork_transforms -q"]

[tasks."check:reasoning-isolation"]
description = "Fail when a reasoner, rules engine or JVM bridge is declared outside platform/reasoning-testkit (ADR-A83)"
run = "python tools/reasoning_isolation_check.py"

[tasks."build:document-schema"]
description = "Generate the document markup's XSD from its RELAX NG source with Trang (ADR-A137). The tests of `config-studio-authoring` fail while it is stale"
run = [
  "mvn -q -f platform/pom.xml dependency:copy -Dartifact=org.relaxng:trang:20241231 -DoutputDirectory={{config_root}}/platform/target/tools",
  "java -jar platform/target/tools/trang-20241231.jar -I rnc -O xsd contracts/document/document.rnc contracts/document/document.xsd",
]

[tasks."check:authoring"]
description = "Every check of the Word add-in and the authoring domain package that needs no running stack"
depends = ["check:authoring-addin", "test:authoring-addin"]

[tasks."services:up"]
description = "Start the reference platform services"
run = "docker compose -f deployment/compose/docker-compose.yml up -d"

[tasks."services:down"]
description = "Stop the reference platform services"
run = "docker compose -f deployment/compose/docker-compose.yml down"

# --- Configuration Studio (ADR-A136), a proof of concept ---------------------------------------
# Fuseki on 127.0.0.1:3130 with a dataset "studio", and RabbitMQ on 127.0.0.1:5673, from
# `mise run studio:infra` (Docker) or started by hand (the service's README). Then studio:service,
# studio:worker and studio:web, each in its own terminal, and browse http://127.0.0.1:4175.
# studio:up and studio:down do all of it in the background, on every platform.

[tasks."build:config-studio-assets"]
description = "Stage the Configuration Studio's vocabulary and samples into .build/config-studio"
run = "python tools/config_studio_stage.py"

[tasks."check:config-studio"]
description = "Test the Configuration Studio: its staging, worker, service, and browser code"
depends = ["build:config-studio-assets", "check:authoring-domain"]
run = [
  "python -m pytest tools/test_config_studio_stage.py tools/test_config_studio_stack.py workers/tests/test_config_studio_worker.py workers/tests/test_config_studio_layers.py -q",
  "mvn -q -f platform/pom.xml -pl config-studio-authoring,config-studio-service,config-studio-writer,config-studio-transforms -am verify",
  "yarn workspace @lattice/config-studio run check",
]

[tasks."test:config-studio"]
description = "Run the Configuration Studio's browser tests against a fake service"
depends = ["build:config-studio-assets"]
run = "yarn workspace @lattice/config-studio run test"

[tasks."studio:up"]
description = "Start the Configuration Studio in the background: Fuseki, RabbitMQ, the store writer, the service, the worker and the transforms worker. `-- --docker` runs Fuseki and RabbitMQ in Docker, `-- --dev` adds the browser code with hot reload"
depends = ["build:config-studio-assets"]
run = "python tools/config_studio_stack.py up"

[tasks."studio:down"]
description = "Stop what studio:up started, each through its own shutdown"
run = "python tools/config_studio_stack.py down"

[tasks."studio:status"]
description = "Show what studio:up started and which of the studio's ports are listening"
run = "python tools/config_studio_stack.py status"

[tasks."studio:infra"]
description = "Start Fuseki and RabbitMQ for the Configuration Studio in Docker"
run = "docker compose -f deployment/compose/config-studio/docker-compose.yml up -d --wait"

[tasks."studio:service"]
description = "Build and run the Configuration Studio's service on 127.0.0.1:8090 against Fuseki and RabbitMQ"
depends = ["build:config-studio-assets"]
env = { LATTICE_FUSEKI_URL = "http://127.0.0.1:3130", LATTICE_FUSEKI_DATASET = "studio", LATTICE_AMQP_URI = "amqp://guest:guest@127.0.0.1:5673/%2F", LATTICE_STUDIO_STATIC = "apps/config-studio/dist" }
run = "mvn -q -f platform/pom.xml -pl config-studio-service -am package -DskipTests && java -jar platform/config-studio-service/target/config-studio-service.jar"

[tasks."studio:ca"]
description = "Copy the Word add-in proxy's local root certificate to .build/config-studio, to trust it for https://localhost:3443"
run = "docker compose -f deployment/compose/config-studio/docker-compose.yml cp addin-proxy:/data/caddy/pki/authorities/local/root.crt .build/config-studio/addin-root.crt"

[tasks."studio:writer"]
description = "Build and run the Configuration Studio's store writer against Fuseki's update service and RabbitMQ's writes super stream. Run several to spread the partitions"
env = { LATTICE_FUSEKI_URL = "http://127.0.0.1:3130", LATTICE_FUSEKI_WRITE_DATASET = "studio-write", LATTICE_AMQP_URI = "amqp://guest:guest@127.0.0.1:5673/%2F", LATTICE_STREAM_URI = "rabbitmq-stream://guest:guest@127.0.0.1:5553/%2f" }
run = "mvn -q -f platform/pom.xml -pl config-studio-writer -am package -DskipTests && java -jar platform/config-studio-writer/target/config-studio-writer.jar"

[tasks."studio:worker"]
description = "Run the Configuration Studio's worker against Fuseki and RabbitMQ"
env = { LATTICE_FUSEKI_URL = "http://127.0.0.1:3130", LATTICE_FUSEKI_DATASET = "studio", LATTICE_AMQP_URI = "amqp://guest:guest@127.0.0.1:5673/%2F" }
run = "python -m lattice_workers.config_studio_main"

[tasks."studio:transforms"]
description = "Build and run the Configuration Studio's transforms worker, which runs the mapping part's XSLT stylesheets and JOLT chains, against Fuseki and RabbitMQ"
env = { LATTICE_FUSEKI_URL = "http://127.0.0.1:3130", LATTICE_FUSEKI_DATASET = "studio", LATTICE_AMQP_URI = "amqp://guest:guest@127.0.0.1:5673/%2F" }
run = "mvn -q -f platform/pom.xml -pl config-studio-transforms -am package -DskipTests && java -jar platform/config-studio-transforms/target/config-studio-transforms.jar"

[tasks."studio:web"]
description = "Serve the Configuration Studio's browser code with hot reload on 127.0.0.1:4175, proxying /api to the service"
run = "yarn workspace @lattice/config-studio run dev"

[tasks.clean]
description = "Clean all build artifacts and caches"
run = [{ tasks = ["clean:java", "clean:python", "clean:frontend", "clean:build", "clean:docs"] }]
run_windows = [{ task = "clean-win" }]

[tasks."clean:java"]
run = ["mvn -f platform/pom.xml clean", "mvn -f packages/minting/java/pom.xml clean"]

[tasks."clean:python"]
description = "Clean Python caches, bytecode, and build artifacts"
run = "rm -rf .build/pytest-cache/* .pytest_cache __pycache__ build/ *.egg-info workers/build; find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null; find . -type d -name '*.egg-info' -exec rm -rf {} + 2>/dev/null; true"

[tasks."clean:frontend"]
description = "Clean Node/Yarn artifacts and frontend build output"
run = "rm -rf node_modules .yarn apps/*/node_modules apps/*/dist .build/yarn-cache/* .build/*-test-results/*; yarn cache clean"

[tasks."clean:build"]
description = "Clean generated build outputs"
run = "rm -rf build/ ontology/mork/mtp/out/ .build/authoring .build/config-studio"

[tasks."clean:docs"]
description = "Clean local Jekyll/Bundler artifacts under docs/ (never the committed Gemfile/Gemfile.lock)"
run = "rm -rf docs/vendor docs/.bundle docs/_site docs/.jekyll-cache docs/.jekyll-metadata"

[tasks."clean-win"]
description = "Clean all build artifacts and caches (Windows PowerShell equivalent of clean). Run directly, or let `clean` fall back to it automatically on Windows."
depends = ["clean:java", "clean-win:python", "clean-win:frontend", "clean-win:build", "clean-win:docs"]

[tasks."clean-win:python"]
description = "Clean Python caches, bytecode, and build artifacts (Windows)"
shell = "powershell -c"
run = '''
$ErrorActionPreference = "SilentlyContinue"
Remove-Item -Recurse -Force .build/pytest-cache, .pytest_cache, build, *.egg-info, workers/build
Get-ChildItem -Recurse -Directory -Include __pycache__, *.egg-info |
    Remove-Item -Recurse -Force
exit 0
'''

[tasks."clean-win:frontend"]
description = "Clean Node/Yarn artifacts and frontend build output (Windows)"
shell = "powershell -c"
run = '''
$ErrorActionPreference = "SilentlyContinue"
Remove-Item -Recurse -Force node_modules, .yarn, .build/yarn-cache
Get-ChildItem -Path apps -Directory |
    ForEach-Object {
        Remove-Item -Recurse -Force (Join-Path $_.FullName "node_modules")
        Remove-Item -Recurse -Force (Join-Path $_.FullName "dist")
    }
Get-ChildItem -Path .build -Directory -Filter *-test-results |
    ForEach-Object {
        Get-ChildItem -Path $_.FullName -Force |
            Where-Object { $_.Name -notlike ".*" } |
            Remove-Item -Recurse -Force
    }
yarn cache clean
exit 0
'''

[tasks."clean-win:build"]
description = "Clean generated build outputs (Windows)"
shell = "powershell -c"
run = '$ErrorActionPreference = "SilentlyContinue"; Remove-Item -Recurse -Force build, ontology/mork/mtp/out, .build/authoring, .build/config-studio; exit 0'

[tasks."clean-win:docs"]
description = "Clean local Jekyll/Bundler artifacts under docs/ (Windows, never the committed Gemfile/Gemfile.lock)"
shell = "powershell -c"
run = '$ErrorActionPreference = "SilentlyContinue"; Remove-Item -Recurse -Force docs/vendor, docs/.bundle, docs/_site, docs/.jekyll-cache, docs/.jekyll-metadata; exit 0'

[tasks."bootstrap:jekyll"]
description = "Install Ruby/Bundler/Jekyll locally for docs/ (GitHub Pages). Not part of the default bootstrap task — run explicitly when working on docs content."
tools = { ruby = "3.4" }
run = """
cd docs
gem install bundler -v 2.6.2 --conservative
bundle config set --local path 'vendor/bundle'
bundle install
"""

[tasks."serve:jekyll"]
description = "Serve docs/ locally with Jekyll (run bootstrap:jekyll first)"
tools = { ruby = "3.4" }
run = "cd docs && bundle exec jekyll serve"

# Formal methods, track D (the prover spike, formal-methods-phase-0.md). Not part of the default
# bootstrap or check tasks: toolchains and images are large, and native installs take minutes to
# hours (epic formal-methods, §4 Environments). Run explicitly when working on spikes/formal-prover.

[tasks."check:formal-network"]
description = "Probe whether track D's tool sources (opam, the Rocq repository, the Isabelle mirror, Docker Hub) are reachable, flagging proxy block pages (epic formal-methods §4)"
run = "python spikes/formal-prover/env/probe_network.py"

[tasks."bootstrap:formal-images"]
description = "Build track D's pinned Rocq+MetaRocq and GHC-wasm images (epic formal-methods §4). Needs Docker. An optional extra root CA is read from NODE_EXTRA_CA_CERTS and never stored in an image layer or committed"
run = "python spikes/formal-prover/env/build_images.py"

[tasks."bootstrap:formal-native-rocq"]
description = "Install an OCaml 5.3.0 opam switch and Rocq natively, for interactive authoring only (epic E9). macOS and Linux need opam on PATH first. Set LATTICE_FORMAL_ROOT or FMX_SWITCH to override the defaults"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File spikes/formal-prover/env/install-ocaml-rocq.ps1"
run = "python spikes/formal-prover/env/install_native.py rocq"

[tasks."bootstrap:formal-native-isabelle"]
description = "Install Isabelle2025-2 natively, with its prebuilt HOL heap, on macOS, Linux or Windows (epic E9). Installs under LATTICE_FORMAL_ROOT, default ~/.local/share/lattice-formal (C:/fmx on Windows)"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File spikes/formal-prover/env/install-isabelle.ps1"
run = "python spikes/formal-prover/env/install_native.py isabelle"

[tasks."check:formal-smoke"]
description = "Confirm both tools run on the image route (portable) for track D (epic formal-methods §4). Pass -- --route native --tool rocq,isabelle on a host with the native toolchains installed for the authoring route too"
run = "python spikes/formal-prover/env/smoke.py"

# Formal methods, track E (the prover programme, tools/proofs/, ADR-A-FM1, ADR-A-FM2). Native
# route only: Isabelle has no image in this programme yet (epic formal-methods §4). Needs
# Isabelle installed first, by bootstrap:formal-native-isabelle or already on PATH.

[tasks."check:proofs"]
description = "Build every tools/proofs/<layer>/ Isabelle session natively and run the proof gate (ADR-A-FM2). Pass a layer name to build only that one"
run = "python tools/proofs/check.py"
