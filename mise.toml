[tools]
java = "25"
maven = "3.9"
node = "22"
python = "3.14"
erlang = "27"
elixir = "1.17"

[env]
# Each checkout, git worktrees included, gets its own .venv, so an editable install never points
# at another checkout (developer guide, "Several checkouts side by side").
_.python.venv = { path = ".venv", create = true }
MAVEN_OPTS = "-Dstyle.color=always"
PYTHONUNBUFFERED = "1"

[tasks.bootstrap]
description = "Install configured toolchains and dependency sets"
depends = ["bootstrap:python-root", "bootstrap:mork", "bootstrap:mork-compilers", "bootstrap:vocabulary", "bootstrap:reference-eligibility", "bootstrap:surface", "bootstrap:persistence", "bootstrap:minting-python", "bootstrap:workers", "bootstrap:frontend"]

[tasks."bootstrap:python-root"]
description = "Install root ontology validation dependencies"
run = "python -m pip install -c requirements-lock.txt \".[reasoning,test]\""

[tasks."bootstrap:workers"]
description = "Install the worker package with test dependencies"
run = "python -m pip install -e \"./workers[test,authoring]\""

[tasks."bootstrap:mork"]
description = "Install the MORK package and MTP structural dependencies"
run = "python -m pip install -e ./tools/mork"

[tasks."bootstrap:mork-compilers"]
depends = ["bootstrap:vocabulary"]
description = "Install the MORK backend compiler package"
run = "python -m pip install -e \"./tools/mork_compilers[test]\""

[tasks."bootstrap:surface"]
depends = ["bootstrap:vocabulary"]
description = "Install the Surface compiler package"
run = "python -m pip install -e ./tools/surface"

[tasks."bootstrap:persistence"]
description = "Install the persistence profile compiler package (ADR-A78/A79)"
run = "python -m pip install -e \"./tools/persistence[test]\""

[tasks."bootstrap:vocabulary"]
description = "Install the Vocabulary scoped/temporal binding reference resolver (ADR-A85)"
run = "python -m pip install -e \"./tools/vocabulary[test]\""

[tasks."bootstrap:reference-eligibility"]
depends = ["bootstrap:mork-compilers"]
description = "Install Eligibility's hand-written reference semantics (formal-methods track B1/B2, ADR-A-FM3)"
run = "python -m pip install -e \"./tools/reference/eligibility[test]\""

[tasks."bootstrap:frontend"]
description = "Install the Yarn workspace through Corepack"
run = "corepack enable && yarn install --immutable"

[tasks.check]
description = "Run all repository validation tasks"
depends = ["check:python-root", "check:workers", "check:java", "check:frontend", "check:spc", "check:persistence", "check:vocabulary", "check:reference-eligibility", "check:mork-compilers", "check:ontology-versioning", "check:ontology-catalog", "check:import-guard", "check:reasoning-isolation", "check:minting", "check:formal-freshness", "check:agent-guidance", "build:mtp", "check:mtp", "check:authoring-tools"]

[tasks.test]
description = "Run the repository test suites"
depends = ["check", "test:frontend"]

[tasks."topology:preflight"]
description = "Check ADR-A77 topology migration prerequisites"
run = "python tools/repository_topology_check.py"

[tasks."topology:ready"]
description = "Check prerequisites for moving semantic roots into ontology"
run = "python tools/repository_topology_check.py --ready"

[tasks."topology:links"]
description = "Check local Markdown links under docs"
run = "python tools/repository_topology_check.py --links"

[tasks."check:python-root"]
run = "python -m unittest surface.test_surface mork_compilers.test_mork_compilers -v && python -m tools.phase8_conformance"

[tasks."check:workers"]
run = "python -m pytest workers/tests"

[tasks."check:authoring-contracts"]
description = "Validate the word authoring POC contracts, templates, samples and fixtures"
run = "python -m pytest workers/tests/test_authoring_contracts.py -q"

[tasks."check:authoring-worker"]
description = "Test the word authoring POC worker (ADR-A114)"
run = "python -m pytest workers/tests/test_wording_le.py workers/tests/test_wording_analysis_worker.py workers/tests/test_authoring_contracts.py -q"

[tasks."check:mtp"]
description = "Check the committed MORK Teaching Pack structure and pins"
run = "python -m mtp.cli check --out ontology/mork/mtp/out"

[tasks."build:mtp"]
description = "Regenerate committed MORK Teaching Pack output"
run = "python -m mtp.cli facts-report; python -m mtp.cli build --out ontology/mork/mtp/out"

[tasks."check:java"]
run = "mvn -f platform/pom.xml verify"

[tasks."check:frontend"]
run = "yarn check"

[tasks."check:authoring-addin"]
description = "Type-check and unit-test the Word authoring add-in"
run = "yarn workspace @lattice/word-authoring-addin run check"

[tasks."test:authoring-addin"]
description = "Type-check, unit-test and run the harness tests of the Word authoring add-in"
depends = ["check:authoring-addin"]
run = "yarn workspace @lattice/word-authoring-addin run test"

[tasks."test:frontend"]
run = "yarn test"

[tasks."check:spc"]
run = "cd tools/spc/erlang && mix test"

[tasks."check:minting-anchors"]
description = "Recompute every identity-minting anchor vector with openssl and the Python standard library, sharing no code with the minting libraries (ADR-A84)"
run = "python contracts/identity/verify-anchors.py"

[tasks."bootstrap:minting-python"]
description = "Install the standalone Python minting library (ADR-A84) with its test extra"
run = "python -m pip install -e \"./packages/minting/python[test]\""

[tasks."check:minting-python"]
description = "Run the Python minting library against the anchors, the generated vectors and the Unicode 16.0 cross-checks"
run = "python -m pytest packages/minting/python/tests -q"

[tasks."check:minting-java"]
description = "Build the standalone Java minting library and run it against the anchors, the generated vectors and the Unicode 16.0 table checks"
run = "mvn -q -f packages/minting/java/pom.xml verify"

[tasks."check:minting"]
description = "Check both identity minting libraries and the anchor vectors (the table check, which downloads the UCD, is check:minting-tables)"
depends = ["check:minting-anchors", "check:minting-python", "check:minting-java"]

[tasks."build:persistence-execution"]
description = "Compile every ontology/persistence example and write its SPARQL and minting recipes to ontology/persistence/execution (generated, ignored by git)"
run = """
set -e
t=$(mktemp -d)
out=ontology/persistence/execution
rm -rf "$out"/*/
for f in ontology/persistence/examples/*.ttl; do
  n=$(basename "$f" .ttl)
  args="$f"
  if [ "$n" = capability-spec-example ]; then args="ontology/persistence/examples/baseline-single-class.ttl --capability-spec $f"; fi
  mkdir -p "$out/$n"
  if python -m persistence compile ontology/persistence/spec/persistence.ttl $args --out "$t/$n.ttl" > "$t/$n.log" 2>&1; then
    python -m persistence instantiate "$t/$n.ttl" --out "$out/$n/sparql" > /dev/null 2>&1
    python -m persistence export-recipes "$t/$n.ttl" --out "$out/$n/recipes" > /dev/null 2>&1 || true
    rmdir "$out/$n/recipes" 2> /dev/null || true
  else
    sed -e "s|$t/||g" "$t/$n.log" > "$out/$n/refused.txt"
  fi
done
rm -rf "$t"
"""

[tasks."build:minting-vectors"]
description = "Compile the identity-minting anchor and coverage fixtures and regenerate the committed recipes and conformance vectors in packages/minting/testdata"
run = """
t=$(mktemp -d)
python -m persistence compile ontology/persistence/spec/persistence.ttl ontology/persistence/examples/identity-minting-anchors.ttl ontology/persistence/examples/identity-minting-coverage.ttl --out "$t/compiled.ttl"
rm -f packages/minting/testdata/*.recipe.json packages/minting/testdata/*.vectors.json
python -m persistence export-recipes "$t/compiled.ttl" --vectors --out packages/minting/testdata
rm -rf "$t"
"""

[tasks."check:minting-tables"]
description = "Regenerate the pinned Unicode 16.0 tables from the UCD and fail if the committed copies differ"
run = "python packages/minting/tools/generate_ucd_tables.py --check"

[tasks."check:persistence"]
description = "Run the persistence profile compiler test suite (resolver, validator, capability, injection corpus, determinism)"
run = "python -m pytest tools/persistence/tests -q"

[tasks."check:vocabulary"]
description = "Run the Vocabulary scoped/temporal binding conformance package (SHACL fixtures, resolver, determinism, consumer boundary; ADR-A85)"
run = "python -m pytest tools/vocabulary/tests -q"

[tasks."check:reference-eligibility"]
description = "Run Eligibility's hand-written reference semantics and its differential tests against tools/mork_compilers (kernel, denotation, laws L9-L16; formal-methods track B1/B2, ADR-A-FM3)"
run = "python -m pytest tools/reference/eligibility/tests -q"

[tasks."check:formal-freshness"]
description = "Check every tools/proofs/<layer>/Kernel.thy and tools/reference/<layer>/ law-coverage still matches its layer's literate README (formal-methods epic, epic principle E1)"
run = "python tools/check_formal_freshness.py"

[tasks."build:agent-guidance"]
description = "Write .github/copilot-instructions.md from AGENTS.md (ADR-A117)"
run = "python tools/agent_guidance.py build"

[tasks."check:agent-guidance"]
description = "Check Copilot's file matches AGENTS.md, every skill is well formed and listed, the plugin marketplace is right, and every link resolves (ADR-A117)"
run = "python tools/agent_guidance.py check && python -m pytest tools/test_agent_guidance.py -q"

[tasks."skills:link"]
description = "Link LATTICE's skills into ~/.copilot/skills for Copilot in other projects (copies on Windows). Re-run after pulling. Pass --target for another directory"
run = "python tools/agent_guidance.py link"

[tasks."check:deny-terms"]
description = "Check staged changes against your personal deny-list, never published (skill lattice-publication-hygiene). Pass --all to scan every tracked file"
run = "python tools/deny_terms.py"

[tasks."hooks:install"]
description = "Install an opt-in git pre-commit hook running the deny-terms check"
run = "python tools/deny_terms.py install-hook"

[tasks."check:mork-compilers"]
description = "Run the MORK backend compiler tests, including generated SPARQL executed against fixtures (ADR-A24, ADR-A89)"
run = "python -m pytest tools/mork_compilers -q"

[tasks."check:ontology-versioning"]
description = "Flag any ontology .ttl file changed without its owl:versionIRI, any shapes/projection file changed without its directory's .version, a missing version, or a current version with no release row (ADR-A86)"
run = "python tools/ontology_version_check.py && python tools/ontology_releases.py check"

[tasks."build:ontology-releases"]
description = "Add a row to docs/architecture/ontology-releases.md for each unreleased ontology version, and list the release tags a person must create (ADR-A86)"
run = "python tools/ontology_releases.py write"

[tasks."check:import-guard"]
description = "Fail when a substrate layer imports or names a layer above it, or a sibling (ADR-A01 addendum, law B7)"
run = "python tools/import_guard.py"

[tasks."build:ontology-catalog"]
description = "Regenerate ontology/catalog-v001.xml and the spec/vocab stub catalogs (ADR-A88)"
run = "python tools/ontology_catalog.py write"

[tasks."check:full-sweep"]
description = "Run every check an ontology change needs, one line each, failures in red with their failing tests, full logs in .build/full-sweep. Versions are compared with main, or pass -- --base-ref REF"
run = "python tools/full_sweep.py"

[tasks."dev:time-ontology-tests"]
description = "Profile check:ontology-catalog as one real run, slowest files and tests first, or with -- --per-file one process per file to find a hung file (python-test-melting, TM0)"
run = "python tools/time_ontology_tests.py"

[tasks."check:ontology-catalog"]
description = "Run the ontology tool tests (catalog, versioning, Eligibility examples, PROV-O alignment, Wording, Behaviour split, Instrument with its regimes and terms in time), then fail when a catalog drifts, an import does not resolve, or a known defect is fixed but still listed (ADR-A88). Parallelised by file (python-test-melting, TM7): a shared, cached graph in tools/conftest.py is per-worker-process, not global, so each worker still benefits from it for its own share of files"
run = "python -m pytest tools/test_applied_shared_contracts.py tools/test_eligibility_examples.py tools/test_mork_order_relations.py tools/test_ontology_catalog.py tools/test_ontology_releases.py tools/test_ontology_version_check.py tools/test_peril_vocabulary.py tools/test_provenance_alignment.py tools/test_reasoning_isolation.py tools/test_substrate_extensions.py tools/test_wording.py tools/test_behaviour_split.py tools/test_import_guard.py tools/test_behaviour_records.py tools/test_behaviour_nested.py tools/test_keys.py tools/test_instrument.py tools/test_regimes.py tools/test_terms_in_time.py tools/test_constitutive_terms.py tools/test_parameter_bindings.py tools/test_amendments.py tools/test_graph_cache.py tools/test_repo_files.py tools/test_environment_banner.py tools/test_reasoning_stalled_import.py tools/test_additivity.py tools/test_legal_acts.py tools/test_full_sweep.py -q -n auto --dist loadfile && python tools/ontology_catalog.py check"

[tasks."bootstrap:reasoning-testkit"]
description = "Build the test-only reasoning harness jar (ADR-A83). Tests that need it skip without it"
run = "mvn -q -f platform/pom.xml -pl reasoning-testkit -am package -DskipTests"

[tasks."check:reasoning-testkit"]
description = "Run the reasoning harness self-tests (ADR-A83)"
run = "mvn -q -f platform/pom.xml -pl reasoning-testkit -am verify"

[tasks."check:reasoning-isolation"]
description = "Fail when a reasoner, rules engine or JVM bridge is declared outside platform/reasoning-testkit (ADR-A83)"
run = "python tools/reasoning_isolation_check.py"

[tasks."check:authoring-service"]
description = "Build and unit-test the word authoring POC service (ADR-A114)"
run = "mvn -f platform/pom.xml -pl authoring-service -am verify"

[tasks."check:authoring-service-it"]
description = "Integration-test the word authoring POC service against Fuseki and RabbitMQ containers"
run = "mvn -f platform/pom.xml -pl authoring-service -am -Pauthoring-it verify"

[tasks."build:authoring-fixtures"]
description = "Regenerate the word authoring POC's generated wording fixtures from the samples (ADR-A114)"
run = "mvn -q -f platform/pom.xml -pl authoring-service -am package -DskipTests && java -cp platform/authoring-service/target/authoring-service.jar org.nebularis.lattice.authoring.app.FixtureWriter contracts/authoring"

[tasks."build:authoring"]
description = "Build the POC service jar and add-in, and stage the image inputs"
run = "mvn -q -f platform/pom.xml -pl authoring-service -am package -DskipTests && yarn workspace @lattice/word-authoring-addin run build && python tools/authoring_stage.py"

[tasks."authoring:up"]
description = "Start the Word authoring POC stack and seed the samples"
depends = ["build:authoring"]
run = "docker compose -f deployment/compose/authoring/docker-compose.yml up -d --build --wait"

[tasks."authoring:down"]
run = "docker compose -f deployment/compose/authoring/docker-compose.yml down"

[tasks."authoring:reset"]
description = "Stop the POC stack and delete its data and local CA"
run = "docker compose -f deployment/compose/authoring/docker-compose.yml down -v"

[tasks."authoring:ca"]
description = "Copy the POC proxy's local root certificate to .build/authoring"
run = "docker compose -f deployment/compose/authoring/docker-compose.yml cp authoring-proxy:/data/caddy/pki/authorities/local/root.crt .build/authoring/lattice-authoring-root.crt"

[tasks."check:authoring-tools"]
description = "Test the word authoring POC staging script (ADR-A114)"
run = "python -m pytest tools/test_authoring_stage.py -q"

[tasks."check:authoring-stack"]
description = "Start the POC stack and run its end-to-end suite"
depends = ["authoring:up"]
run = "yarn workspace @lattice/word-authoring-addin run test:stack"

[tasks."check:authoring"]
description = "All Word authoring POC checks that need no running stack"
depends = ["check:authoring-contracts", "check:authoring-service", "check:authoring-worker", "check:authoring-addin", "test:authoring-addin", "check:authoring-tools"]

[tasks."services:up"]
description = "Start the reference platform services"
run = "docker compose -f deployment/compose/docker-compose.yml up -d"

[tasks."services:down"]
description = "Stop the reference platform services"
run = "docker compose -f deployment/compose/docker-compose.yml down"

[tasks.clean]
description = "Clean all build artifacts and caches"
run = [{ tasks = ["clean:java", "clean:python", "clean:frontend", "clean:build", "clean:docs"] }]
run_windows = [{ task = "clean-win" }]

[tasks."clean:java"]
run = ["mvn -f platform/pom.xml clean", "mvn -f packages/minting/java/pom.xml clean"]

[tasks."clean:python"]
description = "Clean Python caches, bytecode, and build artifacts"
run = "rm -rf .build/pytest-cache/* .pytest_cache __pycache__ build/ *.egg-info workers/build; find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null; find . -type d -name '*.egg-info' -exec rm -rf {} + 2>/dev/null; true"

[tasks."clean:frontend"]
description = "Clean Node/Yarn artifacts and frontend build output"
run = "rm -rf node_modules .yarn apps/*/node_modules apps/*/dist .build/yarn-cache/* .build/*-test-results/*; yarn cache clean"

[tasks."clean:build"]
description = "Clean generated build outputs"
run = "rm -rf build/ ontology/mork/mtp/out/ .build/authoring"

[tasks."clean:docs"]
description = "Clean local Jekyll/Bundler artifacts under docs/ (never the committed Gemfile/Gemfile.lock)"
run = "rm -rf docs/vendor docs/.bundle docs/_site docs/.jekyll-cache docs/.jekyll-metadata"

[tasks."clean-win"]
description = "Clean all build artifacts and caches (Windows PowerShell equivalent of clean). Run directly, or let `clean` fall back to it automatically on Windows."
depends = ["clean:java", "clean-win:python", "clean-win:frontend", "clean-win:build", "clean-win:docs"]

[tasks."clean-win:python"]
description = "Clean Python caches, bytecode, and build artifacts (Windows)"
shell = "powershell -c"
run = '''
$ErrorActionPreference = "SilentlyContinue"
Remove-Item -Recurse -Force .build/pytest-cache, .pytest_cache, build, *.egg-info, workers/build
Get-ChildItem -Recurse -Directory -Include __pycache__, *.egg-info |
    Remove-Item -Recurse -Force
exit 0
'''

[tasks."clean-win:frontend"]
description = "Clean Node/Yarn artifacts and frontend build output (Windows)"
shell = "powershell -c"
run = '''
$ErrorActionPreference = "SilentlyContinue"
Remove-Item -Recurse -Force node_modules, .yarn, .build/yarn-cache
Get-ChildItem -Path apps -Directory |
    ForEach-Object {
        Remove-Item -Recurse -Force (Join-Path $_.FullName "node_modules")
        Remove-Item -Recurse -Force (Join-Path $_.FullName "dist")
    }
Get-ChildItem -Path .build -Directory -Filter *-test-results |
    ForEach-Object {
        Get-ChildItem -Path $_.FullName -Force |
            Where-Object { $_.Name -notlike ".*" } |
            Remove-Item -Recurse -Force
    }
yarn cache clean
exit 0
'''

[tasks."clean-win:build"]
description = "Clean generated build outputs (Windows)"
shell = "powershell -c"
run = '$ErrorActionPreference = "SilentlyContinue"; Remove-Item -Recurse -Force build, ontology/mork/mtp/out, .build/authoring; exit 0'

[tasks."clean-win:docs"]
description = "Clean local Jekyll/Bundler artifacts under docs/ (Windows, never the committed Gemfile/Gemfile.lock)"
shell = "powershell -c"
run = '$ErrorActionPreference = "SilentlyContinue"; Remove-Item -Recurse -Force docs/vendor, docs/.bundle, docs/_site, docs/.jekyll-cache, docs/.jekyll-metadata; exit 0'

[tasks."bootstrap:jekyll"]
description = "Install Ruby/Bundler/Jekyll locally for docs/ (GitHub Pages). Not part of the default bootstrap task — run explicitly when working on docs content."
tools = { ruby = "3.4" }
run = """
cd docs
gem install bundler -v 2.6.2 --conservative
bundle config set --local path 'vendor/bundle'
bundle install
"""

[tasks."serve:jekyll"]
description = "Serve docs/ locally with Jekyll (run bootstrap:jekyll first)"
tools = { ruby = "3.4" }
run = "cd docs && bundle exec jekyll serve"

# Formal methods, track D (the prover spike, formal-methods-phase-0.md). Not part of the default
# bootstrap or check tasks: toolchains and images are large, and native installs take minutes to
# hours (epic formal-methods, §4 Environments). Run explicitly when working on spikes/formal-prover.

[tasks."check:formal-network"]
description = "Probe whether track D's tool sources (opam, the Rocq repository, the Isabelle mirror, Docker Hub) are reachable, flagging proxy block pages (epic formal-methods §4)"
run = "python spikes/formal-prover/env/probe_network.py"

[tasks."bootstrap:formal-images"]
description = "Build track D's pinned Rocq+MetaRocq and GHC-wasm images (epic formal-methods §4). Needs Docker. An optional extra root CA is read from NODE_EXTRA_CA_CERTS and never stored in an image layer or committed"
run = "python spikes/formal-prover/env/build_images.py"

[tasks."bootstrap:formal-native-rocq"]
description = "Install an OCaml 5.3.0 opam switch and Rocq natively, for interactive authoring only (epic E9). macOS and Linux need opam on PATH first. Set LATTICE_FORMAL_ROOT or FMX_SWITCH to override the defaults"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File spikes/formal-prover/env/install-ocaml-rocq.ps1"
run = "python spikes/formal-prover/env/install_native.py rocq"

[tasks."bootstrap:formal-native-isabelle"]
description = "Install Isabelle2025-2 natively, with its prebuilt HOL heap, on macOS, Linux or Windows (epic E9). Installs under LATTICE_FORMAL_ROOT, default ~/.local/share/lattice-formal (C:/fmx on Windows)"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File spikes/formal-prover/env/install-isabelle.ps1"
run = "python spikes/formal-prover/env/install_native.py isabelle"

[tasks."check:formal-smoke"]
description = "Confirm both tools run on the image route (portable) for track D (epic formal-methods §4). Pass -- --route native --tool rocq,isabelle on a host with the native toolchains installed for the authoring route too"
run = "python spikes/formal-prover/env/smoke.py"

# Formal methods, track E (the prover programme, tools/proofs/, ADR-A-FM1, ADR-A-FM2). Native
# route only: Isabelle has no image in this programme yet (epic formal-methods §4). Needs
# Isabelle installed first, by bootstrap:formal-native-isabelle or already on PATH.

[tasks."check:proofs"]
description = "Build every tools/proofs/<layer>/ Isabelle session natively and run the proof gate (ADR-A-FM2). Pass a layer name to build only that one"
run = "python tools/proofs/check.py"
