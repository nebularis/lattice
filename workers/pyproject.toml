[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-workers"
version = "0.1.0"
description = "Graph-reference workers for the LATTICE semantic platform"
requires-python = ">=3.14"
dependencies = [
	"pika>=1.3,<2",
	"psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "jsonschema>=4.23,<5"]
authoring = ["rdflib>=7.1,<8"]
studio = ["rdflib>=7.0,<8", "pyshacl>=0.26,<1", "jsonschema>=4.23,<5", "anthropic>=2.3,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lattice_workers" = ["config-studio-topology.json"]
"lattice_workers.wording_le" = ["forms/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "../.build/pytest-cache"
