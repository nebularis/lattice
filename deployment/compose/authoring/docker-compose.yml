services:
  fuseki:
    image: stain/jena-fuseki:5.1.0
    environment:
      ADMIN_PASSWORD: lattice
    ports:
      - "127.0.0.1:3130:3030"
    volumes:
      - authoring-fuseki:/fuseki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3030/$$/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: lattice
      RABBITMQ_DEFAULT_PASS: lattice
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  authoring-service:
    build:
      context: ../../../.build/authoring/service
    platform: linux/amd64
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      LATTICE_FUSEKI_URL: http://fuseki:3030
      LATTICE_FUSEKI_DATASET: authoring
      LATTICE_FUSEKI_ADMIN_USER: admin
      LATTICE_FUSEKI_ADMIN_PASSWORD: lattice
      LATTICE_AMQP_URI: amqp://lattice:lattice@rabbitmq:5672/%2F
      LATTICE_AUTHORING_SEED_SAMPLES: "true"
    depends_on:
      fuseki:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/authoring-service.jar", "org.nebularis.lattice.authoring.app.HealthProbe", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  authoring-worker:
    build:
      context: ../../../.build/authoring/worker
    platform: linux/amd64
    environment:
      LATTICE_AMQP_URI: amqp://lattice:lattice@rabbitmq:5672/%2F
      LATTICE_FUSEKI_URL: http://fuseki:3030
      LATTICE_FUSEKI_DATASET: authoring
      LATTICE_FUSEKI_USER: admin
      LATTICE_FUSEKI_PASSWORD: lattice
    depends_on:
      rabbitmq:
        condition: service_healthy
      authoring-service:
        condition: service_healthy
    restart: unless-stopped

  authoring-proxy:
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:3443:3443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../../.build/authoring/addin:/srv/addin:ro
      - authoring-caddy-data:/data
    depends_on:
      authoring-service:
        condition: service_healthy

volumes:
  authoring-fuseki:
  authoring-caddy-data:
