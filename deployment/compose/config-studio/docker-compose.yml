# Fuseki and RabbitMQ for the Configuration Studio (ADR-A136), on the ports the studio's mise
# tasks use. The service, worker and browser code run on the host: `mise run studio:service`,
# `studio:worker` and `studio:web`. Workspaces are kept in the volume studio-data, a TDB2 database,
# so `docker compose down` keeps them and `docker compose down -v` deletes them.
services:
  fuseki:
    build:
      context: .
      dockerfile: fuseki.Dockerfile
    ports:
      - "127.0.0.1:3130:3030"
    volumes:
      - studio-data:/data
      - ./fuseki-studio.ttl:/opt/fuseki/studio.ttl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3030/$$/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit loopback_users []"
    volumes:
      # The image's own plugins, and the stream plugin the writes super stream needs.
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq-stream.conf:/etc/rabbitmq/conf.d/20-stream.conf:ro
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
      - "127.0.0.1:5553:5552"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  studio-data:
