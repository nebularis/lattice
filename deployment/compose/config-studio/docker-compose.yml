# Fuseki, RabbitMQ and the Word add-in's HTTPS proxy for the Configuration Studio (ADR-A136), on the ports the
# studio's mise tasks use. Start it with `mise run studio:infra` or `studio:up --docker`, which write the broker's configuration
# and add the override for the kind of Docker, docker-compose.desktop.yml or docker-compose.host-network.yml. The service, worker and browser code run on the host: `mise run studio:service`,
# `studio:worker` and `studio:web`. Workspaces are kept in the volume studio-data, a TDB2 database,
# so `docker compose down` keeps them and `docker compose down -v` deletes them.
services:
  fuseki:
    build:
      context: .
      dockerfile: fuseki.Dockerfile
    ports:
      - "127.0.0.1:3130:3030"
    volumes:
      - studio-data:/data
      - ./fuseki-studio.ttl:/opt/fuseki/studio.ttl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3030/$$/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    volumes:
      # The image's own plugins, the stream plugin the writes super stream needs, and Web MQTT with the HTTP auth backend that
      # carry the studio's events to the browser. `studio:up --docker` writes the broker's user, its checks at the service and
      # its listeners to .build/config-studio/infra/compose. Its ports are in the override for the kind of Docker.
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ../../../.build/config-studio/infra/compose/rabbitmq-studio.conf:/etc/rabbitmq/conf.d/30-studio.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The Word add-in's built files over HTTPS, which Word needs, with /api passed to the service on the host. Its local CA
  # signs the certificate, so trust the root `mise run studio:ca` copies out. `studio:up --docker` builds the add-in first.
  addin-proxy:
    image: caddy:2.10-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../../apps/word-authoring-addin/dist:/srv/addin:ro
      - addin-caddy-data:/data

volumes:
  studio-data:
  addin-caddy-data:
