[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mork-communities"
version = "0.2.0"
description = "MORK community discovery and projection tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rdflib>=7.0",
  "pyshacl>=0.26,<1",
  "pyyaml>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "src/python"}
py-modules = ["mcn_decoder", "mcn_codebook"]

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["mork_communities*", "mtp*", "mcn*"]
