# SPDX-License-Identifier: MPL-2.0
# REUSE annotations for files that cannot carry an SPDX comment header.
# See CONTRIBUTING.md, "SPDX headers", and https://reuse.software/spec-3.3/
version = 1

# JSON contracts: schemas, anchor vectors and fixtures. JSON has no comment
# syntax, so their licence is declared here. They are consumed by code, so
# they are MPL-2.0 like the code that reads them (ADR-A71, ADR-A84).
[[annotations]]
path = ["contracts/**/*.json"]
precedence = "aggregate"
SPDX-License-Identifier = "MPL-2.0"

# Recipes and conformance vectors generated for the minting libraries.
[[annotations]]
path = ["packages/minting/testdata/*.json"]
precedence = "aggregate"
SPDX-License-Identifier = "MPL-2.0"

# The document-to-wording kit's expected outputs, compared line by line against the kit's output (ADR-A137).
# A comment line would be read back as data, so the licence is declared here.
[[annotations]]
path = ["contracts/xml/document-to-wording/*/expected/*.nt", "workers/tests/fixtures/wording_le/*.nt"]
precedence = "aggregate"
SPDX-License-Identifier = "MPL-2.0"

# Persistence builder goldens (formal-methods H2.6): the version and a digest of the text each builder renders. JSON has no
# comment syntax, so the licence is declared here.
[[annotations]]
path = ["tools/persistence/tests/fixtures/ir/builder-goldens.json"]
precedence = "aggregate"
SPDX-License-Identifier = "MPL-2.0"

# The CSV source of the policies examples. CSV has no comment syntax, so a header line would be read back as a row, and the licence
# is declared here. It is the licence the other examples of that folder carry.
[[annotations]]
path = ["tools/mork_transforms/tests/examples/policies/source.csv"]
precedence = "aggregate"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Copies of files of the OASIS LegalRuleML Core Specification 1.0, unmodified, so they carry no header of ours. Their notice is
# in contracts/config-studio/legalruleml/README.md. The licence is the OASIS IPR Policy's, which has no SPDX identifier.
[[annotations]]
path = ["contracts/config-studio/legalruleml/examples/ex5-section29new-compact.lrml", "contracts/config-studio/legalruleml/examples/ex5-section29new-normal.lrml", "contracts/config-studio/legalruleml/xslt/triplifyMerger-ids-noxi.xsl"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) OASIS Open 2021. All Rights Reserved."
SPDX-License-Identifier = "LicenseRef-OASIS-IPR-Policy"
