# SPDX-License-Identifier: MPL-2.0
# REUSE annotations for files that cannot carry an SPDX comment header.
# See CONTRIBUTING.md, "SPDX headers", and https://reuse.software/spec-3.3/
version = 1

# JSON contracts: schemas, anchor vectors and fixtures. JSON has no comment
# syntax, so their licence is declared here. They are consumed by code, so
# they are MPL-2.0 like the code that reads them (ADR-A71, ADR-A84).
[[annotations]]
path = ["contracts/**/*.json"]
precedence = "aggregate"
SPDX-License-Identifier = "MPL-2.0"

# Recipes and conformance vectors generated for the minting libraries.
[[annotations]]
path = ["packages/minting/testdata/*.json"]
precedence = "aggregate"
SPDX-License-Identifier = "MPL-2.0"

# The document-to-wording kit's expected outputs, compared line by line against the kit's output (ADR-A137).
# A comment line would be read back as data, so the licence is declared here.
[[annotations]]
path = ["contracts/xml/document-to-wording/*/expected/*.nt", "workers/tests/fixtures/wording_le/*.nt"]
precedence = "aggregate"
SPDX-License-Identifier = "MPL-2.0"

# Persistence builder goldens (formal-methods H2.6): the version and a digest of the text each builder renders. JSON has no
# comment syntax, so the licence is declared here.
[[annotations]]
path = ["tools/persistence/tests/fixtures/ir/builder-goldens.json"]
precedence = "aggregate"
SPDX-License-Identifier = "MPL-2.0"
