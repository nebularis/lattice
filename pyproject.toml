[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-tooling"
version = "0.1.0"
description = "Shared development and validation environment for LATTICE tooling"
requires-python = ">=3.14"
dependencies = [
  "rdflib>=7.0,<8",
  "pyshacl>=0.26,<1",
]

[project.optional-dependencies]
reasoning = [
  "owlrl>=7.1,<8",
]
community = [
  "numpy>=1.24,<3",
  "networkx>=3,<4",
  "pydantic>=2,<3",
  "langchain-core>=0.2",
  "langgraph>=0.2",
]
all = [
  "owlrl>=7.1,<8",
  "numpy>=1.24,<3",
  "networkx>=3,<4",
  "pydantic>=2,<3",
  "langchain-core>=0.2",
  "langgraph>=0.2",
]

[tool.uv]
package = false

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tools"]
python_files = ["test_*.py"]
cache_dir = ".build/pytest-cache"
