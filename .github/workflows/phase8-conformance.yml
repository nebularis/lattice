# SPDX-License-Identifier: MPL-2.0

name: Phase 8 conformance

# Temporarily manual-only while the broader platform validation is stabilised.
on:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository validation dependencies
        run: python -m pip install -c requirements-lock.txt ".[reasoning]"
      - name: Check Surface extraction
        run: python tools/literate_extract.py ontology/surface/README.md --layer surface --root . --shapes shapes/structural.ttl shapes/constraints.ttl --check
      - name: Run compiler tests
        run: python -m pip install -e ./tools/mork_compilers -e ./tools/surface
      - run: python -m unittest surface.test_surface mork_compilers.test_mork_compilers -v
      - name: Run Phase 8 conformance gate
        run: python -m tools.phase8_conformance
