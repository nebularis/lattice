name: Phase 8 conformance

# Manual-only (workflow_dispatch), same cost-control reason as platform.yml.
# A focused subset of that workflow's ontology-and-tools job, for a quick
# conformance-only run without the full platform suite.
on:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run bootstrap:python-root bootstrap:vocabulary bootstrap:mork-compilers bootstrap:surface
      - name: Check Surface extraction
        run: mise exec -- python tools/literate_extract.py ontology/surface/README.md --layer surface --root . --shapes shapes/structural.ttl shapes/constraints.ttl --check
      - name: Run compiler tests
        run: mise exec -- python -m unittest surface.test_surface mork_compilers.test_mork_compilers -v
      - name: Run Phase 8 conformance gate
        run: mise exec -- python -m tools.phase8_conformance
