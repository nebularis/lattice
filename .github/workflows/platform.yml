# SPDX-License-Identifier: MPL-2.0
name: Platform checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  licence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  python-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -c requirements-lock.txt ".[reasoning]"
      - run: python tools/literate_extract.py surface/README.md --layer surface --root . --shapes shapes/structural.ttl shapes/constraints.ttl --check
      - run: python -m unittest tools.surface.test_surface tools.mork_compilers.test_mork_compilers -v
      - run: python -m tools.phase8_conformance

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ./workers[test]
      - run: python -m pytest workers/tests

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -f platform/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn build
      - run: yarn playwright install --with-deps chromium
      - run: yarn test
