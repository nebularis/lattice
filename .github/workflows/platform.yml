# SPDX-License-Identifier: MPL-2.0
name: Platform checks

# Deliberately manual-only (workflow_dispatch), to control compute cost while
# the formal-methods and CCS/insurml-alignment epics are still landing large
# changes at once. Every job below calls the same `mise` tasks a developer
# runs locally (see docs/developer/developer-guide.md and mise.toml), so
# enabling automatic triggering is a one-line change here, not a redesign:
# uncomment the block below once the human chooses to activate continuous
# checking.
#
# on:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  # Ontology layers, their compiler/resolver/reference packages, and the
  # repository-wide ontology gates (catalog, versioning, import guard,
  # reasoning isolation, formal-methods freshness). One job: these packages
  # share the Python toolchain and several depend on each other's install
  # (mork-compilers and surface both need vocabulary, ADR-A85).
  ontology-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: mise run bootstrap:python-root bootstrap:vocabulary bootstrap:mork bootstrap:mork-compilers bootstrap:surface bootstrap:persistence bootstrap:reference-eligibility
      - name: Surface literate extraction (--check)
        run: mise exec -- python tools/literate_extract.py ontology/surface/README.md --layer surface --root . --shapes shapes/structural.ttl shapes/constraints.ttl --check
      - run: mise run check:python-root
      - run: mise run check:vocabulary
      - run: mise run check:persistence
      - run: mise run check:reference-eligibility
      - run: mise run check:mork-compilers
      - run: mise run check:ontology-versioning
      - run: mise run check:ontology-catalog
      - run: mise run check:import-guard
      - run: mise run check:reasoning-isolation
      - run: mise run check:formal-freshness

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run bootstrap:workers
      - run: mise run check:workers

  mtp-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run bootstrap:mork
      - run: mise exec -- python -m pytest tools/mork/src/test_mtp.py
      - run: mise run build:mtp
      - run: mise run check:mtp
      - run: git diff --exit-code ontology/mork/mtp/out/ ontology/mork/mtp/data/pins.lock.json

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run check:java

  minting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run bootstrap:minting-python
      - run: mise run check:minting

  spc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run check:spc

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run bootstrap:frontend
      - run: mise run check:frontend
      - run: mise exec -- yarn build
      - run: mise exec -- yarn playwright install --with-deps chromium
      - run: mise exec -- yarn test
