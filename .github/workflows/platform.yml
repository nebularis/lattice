# SPDX-License-Identifier: MPL-2.0
name: Platform checks

# Temporarily manual-only while the authored Phase 0-6 implementation is
# validated in a live toolchain environment.
on:
  workflow_dispatch:

jobs:
  licence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  python-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -c requirements-lock.txt ".[reasoning]"
      - run: python tools/literate_extract.py ontology/surface/README.md --layer surface --root . --shapes shapes/structural.ttl shapes/constraints.ttl --check
      - run: python -m pip install -e ./tools/mork -e ./tools/mork_compilers -e ./tools/surface
      - run: python -m unittest surface.test_surface mork_compilers.test_mork_compilers -v
      - run: python -m tools.phase8_conformance

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ./workers[test]
      - run: python -m pytest workers/tests

  mtp-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ./tools/mork
      - run: python -m pytest tools/mork/src/test_mtp.py
      - run: python -m mtp.cli build --out ontology/mork/mtp/out
      - run: python -m mtp.cli check --out ontology/mork/mtp/out
      - run: git diff --exit-code ontology/mork/mtp/out/ ontology/mork/mtp/data/pins.lock.json

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -f platform/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn build
      - run: yarn playwright install --with-deps chromium
      - run: yarn test
