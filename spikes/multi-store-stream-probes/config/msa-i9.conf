# SPDX-License-Identifier: MPL-2.0
# A three node cluster of the studio's broker image, formed by classic configuration peer discovery. The stream protocol listens
# on 5552 and each node advertises its own host name, which the client containers resolve on the msa-i9-net network. The
# guest user may connect from another host, which the studio's own configuration also allows for its compose network.
loopback_users = none
listeners.tcp.default = 5672
stream.listeners.tcp.1 = 5552
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@msa-i9-rmq1
cluster_formation.classic_config.nodes.2 = rabbit@msa-i9-rmq2
cluster_formation.classic_config.nodes.3 = rabbit@msa-i9-rmq3
log.console.level = warning
