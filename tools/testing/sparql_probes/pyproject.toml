[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-testing-sparql-probes"
version = "0.1.0"
description = "Probes of how SPARQL engines behave, run on rdflib, Oxigraph and Jena, for LATTICE's conformance runs (ADR-A125)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "rdflib>=7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
