[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-testing-mem-check"
version = "0.1.0"
description = "How much memory is available, and how many test workers fit in it, for LATTICE's test suites (ADR-A125)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
