[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-testing-oxigraph"
version = "0.1.0"
description = "An in-memory Oxigraph engine for LATTICE's tests, checks and benchmarks (ADR-A125). Not a store SPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pyoxigraph>=0.5.13,<0.6",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
