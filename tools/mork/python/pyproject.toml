[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mork-communities"
version = "0.2.0"
description = "MORK community discovery and projection tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rdflib>=7.0",
  "numpy>=1.24,<3",
  "networkx>=3,<4",
  "pydantic>=2,<3",
  "langchain-core>=0.2",
  "langchain-litellm>=0.1",
  "langgraph>=0.2",
]

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["mork_communities*"]
