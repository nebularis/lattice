[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spc-toolchain"
version = "0.1.0"
description = "Design-time toolchain for Subject Process Calculus"
requires-python = ">=3.14"
dependencies = [
    "rdflib>=7.0",
    "parsimonious>=0.10",       # PEG parser
    "requests>=2.31",
    "click>=8.1",
    "pyyaml>=6.0",
    "isodate>=0.6",
    "jsonschema>=4.20",
    "pyrml>=0.3",               # RML processor (or rmlmapper-java wrapper)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
]

[project.scripts]
spc = "spc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spc"]