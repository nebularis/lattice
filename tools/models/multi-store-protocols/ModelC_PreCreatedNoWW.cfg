\* SPDX-License-Identifier: MPL-2.0
\* Model C, the first write as a guarded replace of a row created at seq 0, on
\* a snapshot store that detects no write-write conflict, two writers.
\* Expected: OneFirstWrite is violated.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Isolation = "SnapshotNoWW"
    FirstWrite = "PreCreatedRow"
    Resend = FALSE
    Retries = 0
INVARIANTS
    TypeOK
    OneFirstWrite
