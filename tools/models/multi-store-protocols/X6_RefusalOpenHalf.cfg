\* As X6_RefusalOpen.cfg, checking that each claim ends in both ledgers or in
\* neither.
\* Expected: NoHalfClaim is violated.
SPECIFICATION Spec
CONSTANTS
    RefusalReturnsRevision = FALSE
    RecordStart = TRUE
    Retries = 1
    MaxStops = 1
    WithReader = FALSE
    Contracts = {0, 1, 2}
    Aggregates = {0, 1, 2}
    Orders = {"E1First", "E2First", "Same"}
INVARIANTS
    NoHalfClaim
