\* X7 with the epoch checked in every request and the read a command is planned from also reading the epoch and the receipt, a creation, a change and a deletion, a resend, two writers that take the stream in order from the stored offset,
\* one crash, weak fairness on each writer's actions but its crash.
\* Checks that where the last writer to start stays alive, every command is eventually answered. Expected to hold.
SPECIFICATION FairSpec
CONSTANTS
    Guard = "FencedAnswer"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "CreateSetDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 2
INVARIANTS
    TypeOK
PROPERTIES
    EventuallyAnswered
