\* SPDX-License-Identifier: MPL-2.0
\* X1 with receipts and no partition row, offsets stored as applied, one writer
\* at a time, up to two crashes.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    K = 3
    W = 2
    MaxCrashes = 2
    Zombie = FALSE
    OffsetMode = "Applied"
    WithReader = FALSE
    Outcome <- ReceiptOutcome
INVARIANTS
    TypeOK
    EachAppliedOnceInEffect
    OrderPerKey
    AThenB
    NoGap
PROPERTIES
    VersionStepsByOne
    EventuallyApplied
