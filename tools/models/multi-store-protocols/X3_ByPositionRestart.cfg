\* SPDX-License-Identifier: MPL-2.0
\* X3 with a relay that reads receipts above a global high-water mark, one
\* restart allowed. A restart returns the relay to its last checkpoint, which
\* is not forced, so it does not rescue the skipped receipt in every behaviour.
\* Expected: AllPublished is violated.
SPECIFICATION Spec
CONSTANTS
    Relay = "ByCommitPosition"
    Streams = {"s1", "s2"}
    N = 2
    MaxRestarts = 1
INVARIANTS
    TypeOK
    NoUncommittedPublished
PROPERTIES
    AllPublished
