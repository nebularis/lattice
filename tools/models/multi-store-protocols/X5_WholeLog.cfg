\* SPDX-License-Identifier: MPL-2.0
\* As X5_BuiltLog.cfg with one guard over every row a command writes, a refused
\* command planned again up to three times.
\* Checks that a document the description lists and that is live keeps its patch log.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Stream"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 2
    MaxCrashes = 1
    Retries = 3
INVARIANTS
    LogKept
