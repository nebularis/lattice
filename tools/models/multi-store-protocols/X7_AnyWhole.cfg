\* X7 where a writer that starts takes the stream from any position, a creation, a change and a deletion, a resend, two writers, one crash.
\* Under Whole, which answers from a read another writer's request outdates. Expected to fail `AnswersAgree`.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Any"
    Receipts = "Kept"
    Script = "CreateSetDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 2
INVARIANTS
    TypeOK
    AppliedOnce
    AnswersAgree
