\* SPDX-License-Identifier: MPL-2.0
\* Model D on a store where the guard and the writes are one atomic step,
\* three owners, a resend after a lost reply.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1, o2, o3}
    Isolation = "Atomic"
    Sentinel = FALSE
    Resend = TRUE
    Retries = 0
INVARIANTS
    TypeOK
    OneOwner
