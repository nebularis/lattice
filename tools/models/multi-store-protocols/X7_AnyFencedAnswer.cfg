\* SPDX-License-Identifier: MPL-2.0
\* X7 where a writer that starts takes the stream from any position, a creation, a change and a deletion, a resend, two writers, one crash.
\* Under FencedAnswer. The token does not refuse a writer that answers from a read it made while it held the partition. Expected to fail `AnswersAgree`.
SPECIFICATION Spec
CONSTANTS
    Guard = "FencedAnswer"
    Delivery = "Any"
    Receipts = "Kept"
    Script = "CreateSetDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 2
INVARIANTS
    TypeOK
    AppliedOnce
    AnswersAgree
