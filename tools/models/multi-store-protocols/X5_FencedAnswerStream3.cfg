\* SPDX-License-Identifier: MPL-2.0
\* As X5_FencedAnswerStream.cfg with three writers, each of which may start
\* while the one before is alive, and up to two crashes.
\* Checks the state and the answers.
SPECIFICATION Spec
CONSTANTS
    Guard = "FencedAnswer"
    Delivery = "Stream"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 3
    MaxCrashes = 2
    Retries = 3
INVARIANTS
    TypeOK
    WholeCommands
    AnswersAgree
