\* SPDX-License-Identifier: MPL-2.0
\* Model C, the first write as a guarded replace of a row created at seq 0,
\* on a store where the guards and the writes are one atomic step, three
\* writers, a resend after a lost reply.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Isolation = "Atomic"
    FirstWrite = "PreCreatedRow"
    Resend = TRUE
    Retries = 0
INVARIANTS
    TypeOK
    OneFirstWrite
    OneHead
