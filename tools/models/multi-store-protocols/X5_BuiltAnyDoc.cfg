\* X5 as built, two writers that take the commands in any order, a deletion of
\* the document beside a save of the document, one crash.
\* Expected: WholeCommands is violated, a deletion answered applied with the
\* document's row live.
SPECIFICATION Spec
CONSTANTS
    Guard = "PerStep"
    Delivery = "Any"
    Saves = {"SaveDoc"}
    DelFirst = FALSE
    NWriters = 2
    MaxCrashes = 1
    Retries = 0
INVARIANTS
    WholeCommands
