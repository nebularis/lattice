\* SPDX-License-Identifier: MPL-2.0
\* X8 with a creation, a save of the part and a deletion in one batch, one writer, no crash.
\* A deletion clears the receipts of its own batch. Expected to fail `AnswersAgree`.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Stream"
    Receipts = "Cleared"
    Script = "CreateSaveDel"
    Resend = FALSE
    Live0 = FALSE
    BatchMax = 3
    NWriters = 1
    MaxCrashes = 0
    Retries = 3
INVARIANTS
    TypeOK
    WholeCommands
    AppliedOnce
    AnswersAgree
