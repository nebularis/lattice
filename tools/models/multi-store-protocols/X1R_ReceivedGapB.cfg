\* As X1R_Received.cfg, checking only that store B holds no command after one
\* that A holds and B lacks.
\* Expected: NoGapBehindA is violated, a gap in store B alone.
SPECIFICATION Spec
CONSTANTS
    K = 3
    W = 2
    MaxCrashes = 1
    Zombie = FALSE
    OffsetMode = "Received"
    WithReader = FALSE
    Outcome <- ReceiptOutcome
INVARIANTS
    NoGapBehindA
