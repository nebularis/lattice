\* SPDX-License-Identifier: MPL-2.0
\* Model B on a store where the guards and the writes are one atomic step,
\* three writers, the dataset epoch bumped once, a resend after a lost reply.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Isolation = "Atomic"
    Bump = TRUE
    Resend = TRUE
    Retries = 0
INVARIANTS
    TypeOK
    OnePerPosition
    NoLostAppend
    FencedAppends
