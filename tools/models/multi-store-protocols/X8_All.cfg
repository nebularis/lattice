\* X8 with a creation, a change, a save of the part and a deletion, a resend, the epoch checked in every
\* request and the read a batch is planned from also reading the epoch and the receipts,
\* three writers, two crashes. Expected to hold.
SPECIFICATION Spec
CONSTANTS
    Guard = "FencedAnswer"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "CreateSetSaveDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 3
    MaxCrashes = 2
    Retries = 3
INVARIANTS
    TypeOK
    WholeCommands
    AppliedOnce
    AnswersAgree
    PartitionOrder
