\* SPDX-License-Identifier: MPL-2.0
\* X2 under the BestKnown row, checking that the audit flags something. The
\* invariant says no auditable decision is flagged, which is the opposite of
\* the audit doing its work.
\* Expected: NoneSuperseded is violated.
SPECIFICATION Spec
CONSTANTS
    Row = "BestKnown"
    MaxPos = 3
    Values = {"a", "b"}
    Holder0 = "a"
    DecPositions = {1, 2, 3}
INVARIANTS
    TypeOK
    NoneSuperseded
