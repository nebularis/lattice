\* X1 with the guard and the receipt taken out of both stores, so every command
\* given to a store is applied, offsets stored as applied, a successor that may
\* start while the previous writer is alive, one crash. This shows what the
\* guard is worth, since the same model with the guard holds S1 and S2.
\* Expected: EachAppliedOnceInEffect is violated.
SPECIFICATION Spec
CONSTANTS
    K = 3
    W = 2
    MaxCrashes = 1
    Zombie = TRUE
    OffsetMode = "Applied"
    WithReader = FALSE
    Outcome <- UnguardedOutcome
INVARIANTS
    EachAppliedOnceInEffect
    OrderPerKey
