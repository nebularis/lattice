\* As X7_AnswersNoToken.cfg with the token.
\* A writer that lost the partition answers without a request, so the token never refuses it. Expected to fail `AnswersAgree`.
SPECIFICATION Spec
CONSTANTS
    Guard = "Fenced"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "CreateSetDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 3
    MaxCrashes = 2
    Retries = 3
INVARIANTS
    AnswersAgree
