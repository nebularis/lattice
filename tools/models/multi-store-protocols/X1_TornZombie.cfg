\* X1 with a reader of A then B, checking only the torn read, offsets stored as
\* applied, a successor that may start while the previous writer is alive.
\* Expected: NoTornRead is violated.
SPECIFICATION Spec
CONSTANTS
    K = 3
    W = 2
    MaxCrashes = 1
    Zombie = TRUE
    OffsetMode = "Applied"
    WithReader = TRUE
INVARIANTS
    NoTornRead
