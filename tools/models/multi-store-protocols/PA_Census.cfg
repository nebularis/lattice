\* SPDX-License-Identifier: MPL-2.0
\* Every variant of the protocol, the position rule, the second actor and the
\* interleaving, with the constants of PA_OnRead.cfg. Census holds by
\* construction and prints a line for each state where both actors are done,
\* naming the variant, the cell, the stops taken and whether O1 to O4 hold.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Protocols = {"OnRead", "OnLatest", "PerPosting"}
    Rules = {"Stimulus", "LaterOf"}
    Others = {"Credit", "Activation"}
    Modes = {"Concurrent", "OneAfterAnother"}
    MaxStops = 1
    StopActors = {"A", "O"}
    Bundles = {0, 1, 2, 3}
    Quotas = {0, 1, 2}
    Orders = {"AFirst", "OFirst", "Same"}
    Stated = 3
    CreditSeats = 1
    Licences = "One"
    AlertNeedsQuota = FALSE
INVARIANTS
    TypeOK
    Census
