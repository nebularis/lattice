\* SPDX-License-Identifier: MPL-2.0
\* X3 with a relay that reads receipts above a global high-water mark, two
\* streams of two receipts, no restart. The invariant holds by construction.
\* Expected: AllPublished is violated.
SPECIFICATION Spec
CONSTANTS
    Relay = "ByCommitPosition"
    Streams = {"s1", "s2"}
    N = 2
    MaxRestarts = 0
INVARIANTS
    TypeOK
    NoUncommittedPublished
PROPERTIES
    AllPublished
