SPECIFICATION Spec
CONSTANTS
    Protocol = "Fenced"
    Timeouts = FALSE
    Writers = {1, 2}
    PerWriter = 3
INVARIANTS
    TypeOK
    NoLostWrite
    SingleAuthority
PROPERTIES
    AllAcknowledged
