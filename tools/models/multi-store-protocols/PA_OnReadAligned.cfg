\* SPDX-License-Identifier: MPL-2.0
\* Protocol A on the instance of the Python model of tools/models/ledger-pass-revision:
\* the bundle at 0, 1 or 2 and the quota at 1 or 3, a credit of 3 seats with no
\* ceiling it reaches, a second activation of a licence of its own, the alert's
\* guard asking for a unit in the quota, and one stop of A at any point.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Protocols = {"OnRead"}
    Rules = {"LaterOf"}
    Others = {"Credit", "Activation"}
    Modes = {"Concurrent"}
    MaxStops = 1
    StopActors = {"A"}
    Bundles = {0, 1, 2}
    Quotas = {1, 3}
    Orders = {"AFirst", "OFirst", "Same"}
    Stated = 5
    CreditSeats = 3
    Licences = "PerActor"
    AlertNeedsQuota = TRUE
INVARIANTS
    TypeOK
    SerialOutcomes
    StopSafe
    PassOrder
    NotBeforeStimulus
