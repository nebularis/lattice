\* SPDX-License-Identifier: MPL-2.0
\* Model C, create-if-absent on a snapshot store where only a statement both
\* transactions delete is a conflict, two writers, an aborted commit sent
\* again once.
\* Expected: OneFirstWrite is violated.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Isolation = "SnapshotDeleteWW"
    FirstWrite = "AbsentRow"
    Resend = FALSE
    Retries = 1
INVARIANTS
    TypeOK
    OneFirstWrite
