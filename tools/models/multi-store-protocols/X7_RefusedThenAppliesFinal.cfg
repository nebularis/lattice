\* As X7_RefusedThenApplies.cfg, held to R2 as option (a) of MSA-Q29 restates it, where only an answer of applied is final.
SPECIFICATION Spec
CONSTANTS
    Guard = "WholeAnswer"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "SetCreate"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 1
    NWriters = 1
    MaxCrashes = 0
    Retries = 2
INVARIANTS
    TypeOK
    AppliedOnce
    AppliedIsFinal
PROPERTIES
    NoRefusalAfterApplied
