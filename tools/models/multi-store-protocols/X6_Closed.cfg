\* SPDX-License-Identifier: MPL-2.0
\* A pass over two ledgers with both gaps closed: a refused request returns the
\* revision found, and the C pass records the revisions its decision started
\* from. Two claims on one contract, one stop at any point, the contract's
\* account and the aggregate each at 0, 1 or 2, the stimuli in either order of
\* position or at one position.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    RefusalReturnsRevision = TRUE
    RecordStart = TRUE
    Retries = 1
    MaxStops = 1
    WithReader = FALSE
    Contracts = {0, 1, 2}
    Aggregates = {0, 1, 2}
    Orders = {"E1First", "E2First", "Same"}
INVARIANTS
    TypeOK
    SerialClaims
    NoHalfClaim
    PassOrderEach
    NotBeforeStimulus
