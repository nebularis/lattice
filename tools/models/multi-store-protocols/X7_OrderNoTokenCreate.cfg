\* SPDX-License-Identifier: MPL-2.0
\* A creation, a change and a deletion with a resend, no token, three writers and two crashes.
\* Checks the order and the state, not the answers. Expected to hold.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "CreateSetDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 3
    MaxCrashes = 2
    Retries = 3
INVARIANTS
    TypeOK
    AppliedOnce
    PartitionOrder
