\* SPDX-License-Identifier: MPL-2.0
\* As X7_OrderNoTokenNoRetry.cfg with the token, which refuses a request from a writer that lost the partition.
\* Checks the order, the state and the answers. Expected to hold.
SPECIFICATION Spec
CONSTANTS
    Guard = "Fenced"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "Sets"
    Resend = FALSE
    Live0 = TRUE
    BatchMax = 2
    NWriters = 3
    MaxCrashes = 2
    Retries = 0
INVARIANTS
    TypeOK
    AppliedOnce
    AnswersAgree
    PartitionOrder
