\* SPDX-License-Identifier: MPL-2.0
\* X3 with a relay that reads receipts above a global high-water mark, two
\* streams of two receipts, no restart, checking order per stream.
\* Expected: PerStreamOrder is violated.
SPECIFICATION Spec
CONSTANTS
    Relay = "ByCommitPosition"
    Streams = {"s1", "s2"}
    N = 2
    MaxRestarts = 0
INVARIANTS
    TypeOK
    PerStreamOrder
