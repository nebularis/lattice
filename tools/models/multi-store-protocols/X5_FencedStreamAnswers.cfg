\* SPDX-License-Identifier: MPL-2.0
\* As X5_FencedStream.cfg, checking the answers only.
\* Expected: AnswersAgree is violated by a writer that has lost the partition
\* and answers a command without sending a request.
SPECIFICATION Spec
CONSTANTS
    Guard = "Fenced"
    Delivery = "Stream"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 2
    MaxCrashes = 1
    Retries = 3
INVARIANTS
    AnswersAgree
