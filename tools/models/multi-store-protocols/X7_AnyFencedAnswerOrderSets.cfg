\* X7 where a writer that starts takes the stream from any position, three changes on a live workspace, no resend, two writers, one crash.
\* Under FencedAnswer, checking the partition's order. The changes carry no expected revision, so no guard gives the order where delivery has none. Expected to fail `PartitionOrder`.
SPECIFICATION Spec
CONSTANTS
    Guard = "FencedAnswer"
    Delivery = "Any"
    Receipts = "Kept"
    Script = "Sets"
    Resend = FALSE
    Live0 = TRUE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 2
INVARIANTS
    TypeOK
    AppliedOnce
    PartitionOrder
