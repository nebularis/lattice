\* As X5_FencedAnswerAny.cfg with two writers that each take the stream in
\* order, both saves and then the deletion.
\* Checks the state and the answers.
SPECIFICATION Spec
CONSTANTS
    Guard = "FencedAnswer"
    Delivery = "Stream"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 2
    MaxCrashes = 1
    Retries = 3
INVARIANTS
    TypeOK
    WholeCommands
    AnswersAgree
