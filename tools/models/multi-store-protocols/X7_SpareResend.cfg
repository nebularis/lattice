\* As X7_SpareBatch.cfg with a resend of the creation after the deletion, and one crash.
\* The deletion has cleared the creation's receipt, so the resend is answered as not applied. Expected to fail `AnswersAgree`.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Stream"
    Receipts = "SpareBatch"
    Script = "CreateDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 1
    MaxCrashes = 1
    Retries = 3
INVARIANTS
    TypeOK
    AppliedOnce
    AnswersAgree
