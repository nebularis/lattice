\* SPDX-License-Identifier: MPL-2.0
\* X8 where a writer that starts takes the stream from any position, a creation, a save of the part and a deletion,
\* no token, two writers, one crash.
\* Checks that a save of the part never applies after the deletion, and that every command is whole. Expected to hold.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Any"
    Receipts = "Kept"
    Script = "CreateSaveDel"
    Resend = FALSE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 2
INVARIANTS
    TypeOK
    WholeCommands
    AppliedOnce
    NoSaveAfterDel
