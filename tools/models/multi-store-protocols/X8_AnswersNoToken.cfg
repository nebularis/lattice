\* SPDX-License-Identifier: MPL-2.0
\* X8 with a creation, a change, a save of the part and a deletion, a resend, no token,
\* two writers, one crash.
\* A writer answers from a read another writer's request outdates. Expected to fail `AnswersAgree`.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "CreateSetSaveDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 3
INVARIANTS
    AnswersAgree
