\* X7 where a change comes first on a workspace with no row, then its creation, then the change again under its first id (a resend), so the change is refused by its own check and its resend applies.
\* One writer, no crash, Kept.
\* Under WholeAnswer, one command to a batch. Expected to fail `AnswersAgree`, since nothing is recorded for a refused command.
SPECIFICATION Spec
CONSTANTS
    Guard = "WholeAnswer"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "SetCreate"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 1
    NWriters = 1
    MaxCrashes = 0
    Retries = 2
INVARIANTS
    TypeOK
    AppliedOnce
    AnswersAgree
