\* Model B on a snapshot store where inserting an identical statement is also
\* a conflict, otherwise as ModelB_SnapshotDeleteWWBump.
\* Expected: FencedAppends is violated.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Isolation = "SnapshotInsertWW"
    Bump = TRUE
    Resend = FALSE
    Retries = 1
INVARIANTS
    TypeOK
    FencedAppends
