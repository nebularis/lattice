\* SPDX-License-Identifier: MPL-2.0
\* Protocol A in one ledger, each pass one request guarded on the revision it
\* was evaluated from, its position the later of its stimulus's and the
\* ledger's latest pass's. O is a credit of one seat or a second activation of
\* the same licence, either actor may stop once at any point, twelve starting
\* balances and the stimuli in either order of position or at one position.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Protocols = {"OnRead"}
    Rules = {"LaterOf"}
    Others = {"Credit", "Activation"}
    Modes = {"Concurrent"}
    MaxStops = 1
    StopActors = {"A", "O"}
    Bundles = {0, 1, 2, 3}
    Quotas = {0, 1, 2}
    Orders = {"AFirst", "OFirst", "Same"}
    Stated = 3
    CreditSeats = 1
    Licences = "One"
    AlertNeedsQuota = FALSE
INVARIANTS
    TypeOK
    SerialOutcomes
    StopSafe
    PassOrder
    NotBeforeStimulus
