\* SPDX-License-Identifier: MPL-2.0
\* Model B on a snapshot store that detects a statement both transactions
\* delete, three writers, no bump, a resend after a lost reply, an aborted
\* commit sent again up to twice.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Isolation = "SnapshotDeleteWW"
    Bump = FALSE
    Resend = TRUE
    Retries = 2
INVARIANTS
    TypeOK
    OnePerPosition
    NoLostAppend
    FencedAppends
