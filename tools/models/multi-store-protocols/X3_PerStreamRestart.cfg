\* SPDX-License-Identifier: MPL-2.0
\* X3 with a relay that tracks the next seq of each stream, one restart
\* allowed, so a receipt can be published twice.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Relay = "PerStreamContiguous"
    Streams = {"s1", "s2"}
    N = 2
    MaxRestarts = 1
INVARIANTS
    TypeOK
    PerStreamOrder
    NoUncommittedPublished
PROPERTIES
    AllPublished
