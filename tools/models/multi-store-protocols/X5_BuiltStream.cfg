\* SPDX-License-Identifier: MPL-2.0
\* X5 as built, two writers that each take the stream in order from the offset
\* stored when they started, a save of the document, a save of the description
\* and then the deletion, one crash.
\* Checks the state only.
SPECIFICATION Spec
CONSTANTS
    Guard = "PerStep"
    Delivery = "Stream"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 2
    MaxCrashes = 1
    Retries = 0
INVARIANTS
    TypeOK
    WholeCommands
