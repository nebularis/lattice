\* As X7_ClearedBatch.cfg, where the deletion leaves the receipts of the commands in its own batch.
\* Checks the state and the answers. Expected to hold.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Stream"
    Receipts = "SpareBatch"
    Script = "CreateDel"
    Resend = FALSE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 1
    MaxCrashes = 0
    Retries = 3
INVARIANTS
    TypeOK
    AppliedOnce
    AnswersAgree
