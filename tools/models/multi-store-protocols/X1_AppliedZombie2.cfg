\* X1 with offsets stored as applied and a successor that may start while the
\* previous writer is still alive, up to two crashes, so up to three incarnations.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    K = 3
    W = 2
    MaxCrashes = 2
    Zombie = TRUE
    OffsetMode = "Applied"
    WithReader = FALSE
INVARIANTS
    TypeOK
    EachAppliedOnceInEffect
    OrderPerKey
    AThenB
PROPERTIES
    VersionStepsByOne
    EventuallyApplied
