\* X5 as built, two writers that each take the stream in order from the offset
\* stored when they started, both saves and then the deletion, one crash.
\* The deletion's request drops the patch log with no guard. Under Stream no writer plans a deletion that two saves outdate,
\* so the log is never dropped with the document live. Expected to hold.
\* Checks that a document the description lists and that is live keeps its patch log.
SPECIFICATION Spec
CONSTANTS
    Guard = "PerStep"
    Delivery = "Stream"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 2
    MaxCrashes = 1
    Retries = 0
INVARIANTS
    LogKept
