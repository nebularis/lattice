\* As X5_BuiltStream.cfg with three writers, each of which may start while the
\* one before is alive, and up to two crashes.
\* Checks the state only.
SPECIFICATION Spec
CONSTANTS
    Guard = "PerStep"
    Delivery = "Stream"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 3
    MaxCrashes = 2
    Retries = 0
INVARIANTS
    TypeOK
    WholeCommands
