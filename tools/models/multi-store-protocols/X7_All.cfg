\* SPDX-License-Identifier: MPL-2.0
\* The token and the answering read, a resend, three writers, two crashes and up to three plannings again.
\* Checks every property. Expected to hold.
SPECIFICATION Spec
CONSTANTS
    Guard = "FencedAnswer"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "CreateSetDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 3
    MaxCrashes = 2
    Retries = 3
INVARIANTS
    TypeOK
    AppliedOnce
    AnswersAgree
    PartitionOrder
