\* Protocol A with each pass at its stimulus's position, the actors one after
\* another and no stop, with the cells of PA_OnRead.cfg, checking O3.
\* Expected: PassOrder is violated.
SPECIFICATION Spec
CONSTANTS
    Protocols = {"OnRead"}
    Rules = {"Stimulus"}
    Others = {"Credit", "Activation"}
    Modes = {"OneAfterAnother"}
    MaxStops = 0
    StopActors = {"A", "O"}
    Bundles = {0, 1, 2, 3}
    Quotas = {0, 1, 2}
    Orders = {"AFirst", "OFirst", "Same"}
    Stated = 3
    CreditSeats = 1
    Licences = "One"
    AlertNeedsQuota = FALSE
INVARIANTS
    PassOrder
