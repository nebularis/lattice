\* As X7_SpareResend.cfg with the token and the answering read, a change between them, three writers and two crashes.
\* The token refuses only a writer that lost the partition, so the resend is still answered as not applied. Expected to fail `AnswersAgree`.
SPECIFICATION Spec
CONSTANTS
    Guard = "FencedAnswer"
    Delivery = "Stream"
    Receipts = "SpareBatch"
    Script = "CreateSetDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 3
    MaxCrashes = 2
    Retries = 3
INVARIANTS
    TypeOK
    AppliedOnce
    AnswersAgree
    PartitionOrder
