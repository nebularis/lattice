\* SPDX-License-Identifier: MPL-2.0
\* X3 with a relay that tracks the next seq of each stream, two streams of two
\* receipts, no restart.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Relay = "PerStreamContiguous"
    Streams = {"s1", "s2"}
    N = 2
    MaxRestarts = 0
INVARIANTS
    TypeOK
    PerStreamOrder
    NoUncommittedPublished
PROPERTIES
    AllPublished
