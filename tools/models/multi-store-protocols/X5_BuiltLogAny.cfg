\* X5 as built, two writers that each take every command once in any order, both
\* saves and the deletion, one crash.
\* The deletion's request drops the patch log with no guard, so a deletion planned before both saves applied drops it
\* and leaves a live, listed document with none. Expected to fail `LogKept`.
\* Checks that a document the description lists and that is live keeps its patch log.
SPECIFICATION Spec
CONSTANTS
    Guard = "PerStep"
    Delivery = "Any"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 2
    MaxCrashes = 1
    Retries = 0
INVARIANTS
    LogKept
