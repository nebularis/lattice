\* As X8_AnswersRead.cfg where a writer that starts takes the stream from any position.
\* A command refused by its own check, taken before the creation it waits on, applies later, as in X7. Expected to fail `AnswersAgree`.
SPECIFICATION Spec
CONSTANTS
    Guard = "WholeAnswer"
    Delivery = "Any"
    Receipts = "Kept"
    Script = "CreateSetSaveDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 3
INVARIANTS
    TypeOK
    WholeCommands
    AppliedOnce
    AnswersAgree
    PartitionOrder
