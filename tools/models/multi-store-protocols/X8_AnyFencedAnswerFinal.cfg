\* As X8_AnyWholeAnswer.cfg under FencedAnswer, held to R2 as option (a) of MSA-Q29 restates it, where only an answer of applied is final. `PartitionOrder` is left out, since a writer that takes the stream from any position breaks it first.
SPECIFICATION Spec
CONSTANTS
    Guard = "FencedAnswer"
    Delivery = "Any"
    Receipts = "Kept"
    Script = "CreateSetSaveDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 3
INVARIANTS
    TypeOK
    WholeCommands
    AppliedOnce
    AppliedIsFinal
PROPERTIES
    NoRefusalAfterApplied
