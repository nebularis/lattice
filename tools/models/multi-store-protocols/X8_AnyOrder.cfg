\* SPDX-License-Identifier: MPL-2.0
\* X8 where a writer that starts takes the stream from any position, a change of the description,
\* a save of the part and a second change on a live workspace, no token, two writers, one crash.
\* The two changes of the description are guarded on its revision, and the save of the part on the part's alone. Checks the partition's order. Expected to fail `PartitionOrder`.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Any"
    Receipts = "Kept"
    Script = "SetSave"
    Resend = FALSE
    Live0 = TRUE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 1
INVARIANTS
    TypeOK
    WholeCommands
    AppliedOnce
    PartitionOrder
