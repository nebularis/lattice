\* SPDX-License-Identifier: MPL-2.0
\* X3 with a relay that tracks the next seq of each stream, one restart
\* allowed, checking that the restart republishes. The invariant says no
\* receipt is published twice, which is the opposite of at-least-once.
\* Expected: NoDuplicate is violated.
SPECIFICATION Spec
CONSTANTS
    Relay = "PerStreamContiguous"
    Streams = {"s1", "s2"}
    N = 2
    MaxRestarts = 1
INVARIANTS
    TypeOK
    NoDuplicate
