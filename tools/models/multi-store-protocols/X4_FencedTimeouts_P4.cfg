\* As X4_FencedTimeouts.cfg with two writers of four writes, a wide instance.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Protocol = "Fenced"
    Timeouts = TRUE
    Writers = {1, 2}
    PerWriter = 4
INVARIANTS
    TypeOK
    NoLostWrite
    SingleAuthority
PROPERTIES
    AllAcknowledged
