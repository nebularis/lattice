\* SPDX-License-Identifier: MPL-2.0
\* X1 with receipts and no partition row, offsets stored as the highest
\* received, one writer at a time, one crash. The properties checked here are
\* those that do not depend on a command never being skipped.
\* Expected: the invariants hold, and EventuallyApplied is violated.
SPECIFICATION Spec
CONSTANTS
    K = 3
    W = 2
    MaxCrashes = 1
    Zombie = FALSE
    OffsetMode = "Received"
    WithReader = FALSE
    Outcome <- ReceiptOutcome
INVARIANTS
    TypeOK
    AtMostOnce
    OrderPerKey
    AThenB
PROPERTIES
    EventuallyApplied
