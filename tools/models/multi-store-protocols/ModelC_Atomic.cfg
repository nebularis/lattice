\* SPDX-License-Identifier: MPL-2.0
\* Model C, create-if-absent on a store where the guards and the writes are
\* one atomic step, three writers, a resend after a lost reply.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Isolation = "Atomic"
    FirstWrite = "AbsentRow"
    Resend = TRUE
    Retries = 0
INVARIANTS
    TypeOK
    OneFirstWrite
    OneHead
