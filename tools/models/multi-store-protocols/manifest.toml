#               time, the wall time with the JVM's start, and the peak heap read from its GC log, at most 16 MB below the
#               true peak. The runner gives a run a heap of twice peak_heap_mb and 64 MB more, at least 256 MB. A temporal
#               violation prints no depth, and a depth found with several workers can differ by one or two between runs.
#               Each configuration was measured on its own, with nothing else heavy running, through `--heap-mb`: a base
#               one under a heap of 2,048 MB and a wide one under 4,096 MB, with 16 workers where no error is expected and
#               one where a property is expected to be violated. The configurations of PA, X6 and X2A were measured the
#               same way with 8 workers in place of 16, while another session ran its own JVMs on the machine
