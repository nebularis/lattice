\* As X7_OrderNoToken.cfg with no planning again, so a command whose request is refused is answered as not applied.
\* A writer that lost the partition later applies that command after the ones that follow it. Expected to fail `PartitionOrder`.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "Sets"
    Resend = FALSE
    Live0 = TRUE
    BatchMax = 2
    NWriters = 3
    MaxCrashes = 2
    Retries = 0
INVARIANTS
    TypeOK
    AppliedOnce
    PartitionOrder
