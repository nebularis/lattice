\* As X7_SpareResend.cfg where a deletion removes no receipt.
\* The resend is answered from the receipt it finds. Expected to hold.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "CreateDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 1
    MaxCrashes = 1
    Retries = 3
INVARIANTS
    TypeOK
    AppliedOnce
    AnswersAgree
    PartitionOrder
