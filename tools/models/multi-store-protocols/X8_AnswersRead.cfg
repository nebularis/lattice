\* As X8_AnswersNoToken.cfg where the read a batch is planned from also reads its receipts. Expected to hold.
SPECIFICATION Spec
CONSTANTS
    Guard = "WholeAnswer"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "CreateSetSaveDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 3
INVARIANTS
    TypeOK
    WholeCommands
    AppliedOnce
    AnswersAgree
    PartitionOrder
