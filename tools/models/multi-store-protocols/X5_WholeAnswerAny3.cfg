\* SPDX-License-Identifier: MPL-2.0
\* As X5_WholeAnswerAny.cfg with three writers, each of which may start
\* while the one before is alive, and up to two crashes.
\* Checks the state, the answers and the patch log.
SPECIFICATION Spec
CONSTANTS
    Guard = "WholeAnswer"
    Delivery = "Any"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 3
    MaxCrashes = 2
    Retries = 2
INVARIANTS
    TypeOK
    WholeCommands
    AnswersAgree
    LogKept
