\* SPDX-License-Identifier: MPL-2.0
\* X1 with receipts and no partition row, offsets stored as applied, and a
\* successor that may start while the previous writer is still alive, up to two
\* crashes, so up to three incarnations.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    K = 3
    W = 2
    MaxCrashes = 2
    Zombie = TRUE
    OffsetMode = "Applied"
    WithReader = FALSE
    Outcome <- ReceiptOutcome
INVARIANTS
    TypeOK
    EachAppliedOnceInEffect
    OrderPerKey
    AThenB
    NoGap
PROPERTIES
    VersionStepsByOne
    EventuallyApplied
