\* As X6_Closed.cfg with the first gap open: a refusal returns no revision, the
\* request names the same revision again once, and the claim then gives up.
\* Checking that the claims are whole.
\* Expected: SerialClaims is violated.
SPECIFICATION Spec
CONSTANTS
    RefusalReturnsRevision = FALSE
    RecordStart = TRUE
    Retries = 1
    MaxStops = 1
    WithReader = FALSE
    Contracts = {0, 1, 2}
    Aggregates = {0, 1, 2}
    Orders = {"E1First", "E2First", "Same"}
INVARIANTS
    SerialClaims
