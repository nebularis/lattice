\* SPDX-License-Identifier: MPL-2.0
\* Model D with the sentinel counter, on a snapshot store where only a
\* statement both transactions delete is a conflict, three owners, a resend
\* after a lost reply, an aborted commit sent again up to twice.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1, o2, o3}
    Isolation = "SnapshotDeleteWW"
    Sentinel = TRUE
    Resend = TRUE
    Retries = 2
INVARIANTS
    TypeOK
    OneOwner
