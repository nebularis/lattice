\* As X7_AnyWholeAnswer.cfg, held to R2 as option (a) of MSA-Q29 restates it, where only an answer of applied is final.
SPECIFICATION Spec
CONSTANTS
    Guard = "WholeAnswer"
    Delivery = "Any"
    Receipts = "Kept"
    Script = "CreateSetDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 2
INVARIANTS
    TypeOK
    AppliedOnce
    AppliedIsFinal
PROPERTIES
    NoRefusalAfterApplied
