\* SPDX-License-Identifier: MPL-2.0
\* X4 with copy then flip, two writers of two writes, and a writer that may
\* give up on a request and send again after it sees the flip.
\* Expected: SingleAuthority is violated.
SPECIFICATION Spec
CONSTANTS
    Protocol = "Naive"
    Timeouts = TRUE
    Writers = {1, 2}
    PerWriter = 2
INVARIANTS
    TypeOK
    SingleAuthority
