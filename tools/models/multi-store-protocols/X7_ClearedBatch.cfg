\* The creation and the deletion of the workspace in one batch, where the deletion clears every receipt of the workspace and then writes its own.
\* The creation is then answered as not applied. Expected to fail `AnswersAgree`.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Stream"
    Receipts = "Cleared"
    Script = "CreateDel"
    Resend = FALSE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 1
    MaxCrashes = 0
    Retries = 3
INVARIANTS
    TypeOK
    AppliedOnce
    AnswersAgree
