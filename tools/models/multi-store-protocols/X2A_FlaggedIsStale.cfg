\* SPDX-License-Identifier: MPL-2.0
\* X2 under the BestKnown row with the constants of X2_BestKnownAudit.cfg, in
\* which S passes three positions with two values, so a value can change and
\* change back between a read and the decision's position. Checking that the
\* audit flags only a stale decision.
\* Expected: FlaggedIsStale is violated.
SPECIFICATION Spec
CONSTANTS
    Row = "BestKnown"
    MaxPos = 3
    Values = {"a", "b"}
    Holder0 = "a"
    DecPositions = {1, 2, 3}
INVARIANTS
    FlaggedIsStale
