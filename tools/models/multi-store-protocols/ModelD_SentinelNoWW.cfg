\* Model D with the sentinel counter, on a snapshot store that detects no
\* write-write conflict, two owners.
\* Expected: OneOwner is violated.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1, o2}
    Isolation = "SnapshotNoWW"
    Sentinel = TRUE
    Resend = FALSE
    Retries = 0
INVARIANTS
    TypeOK
    OneOwner
