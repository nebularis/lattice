\* SPDX-License-Identifier: MPL-2.0
\* X4 with fence, copy and flip, two writers of two writes, no timeouts.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Protocol = "Fenced"
    Timeouts = FALSE
    Writers = {1, 2}
    PerWriter = 2
INVARIANTS
    TypeOK
    NoLostWrite
    SingleAuthority
PROPERTIES
    AllAcknowledged
