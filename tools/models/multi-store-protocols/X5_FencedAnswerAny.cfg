\* SPDX-License-Identifier: MPL-2.0
\* X5 with one guard, the partition's epoch checked in every request, and an
\* answer given without a request read with the epoch and the receipt, two
\* writers that take the commands in any order, both saves and the deletion,
\* one crash, a refused command planned again up to three times.
\* Checks the state and the answers.
SPECIFICATION Spec
CONSTANTS
    Guard = "FencedAnswer"
    Delivery = "Any"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 2
    MaxCrashes = 1
    Retries = 3
INVARIANTS
    TypeOK
    WholeCommands
    AnswersAgree
