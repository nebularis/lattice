\* Model D on a snapshot store where only a statement both transactions delete
\* is a conflict, two owners, an aborted commit sent again once.
\* Expected: OneOwner is violated.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1, o2}
    Isolation = "SnapshotDeleteWW"
    Sentinel = FALSE
    Resend = FALSE
    Retries = 1
INVARIANTS
    TypeOK
    OneOwner
