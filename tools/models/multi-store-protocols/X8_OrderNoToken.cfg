\* SPDX-License-Identifier: MPL-2.0
\* X8 with a change of the description, a save of the part and a second change on a live workspace,
\* no token, three writers, two crashes, a refused batch planned again once.
\* The commands that write one aggregate carry no revision of the other. Under Stream no command is refused for a stale revision,
\* so a retry never happens. Expected to hold.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "SetSave"
    Resend = FALSE
    Live0 = TRUE
    BatchMax = 2
    NWriters = 3
    MaxCrashes = 2
    Retries = 1
INVARIANTS
    TypeOK
    WholeCommands
    AppliedOnce
    AnswersAgree
    PartitionOrder
