\* X7 where a writer that starts takes the stream from any position, a creation, a change and a deletion, a resend, two writers, one crash.
\* Under WholeAnswer. A command refused by its own check, taken before the creation it waits on, is answered as not applied and applies later. Expected to fail `AnswersAgree`.
SPECIFICATION Spec
CONSTANTS
    Guard = "WholeAnswer"
    Delivery = "Any"
    Receipts = "Kept"
    Script = "CreateSetDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 2
INVARIANTS
    TypeOK
    AppliedOnce
    AnswersAgree
