\* SPDX-License-Identifier: MPL-2.0
\* Model D on a snapshot store where inserting an identical statement is a
\* write-write conflict, three owners, a resend after a lost reply, an aborted
\* commit sent again up to twice.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1, o2, o3}
    Isolation = "SnapshotInsertWW"
    Sentinel = FALSE
    Resend = TRUE
    Retries = 2
INVARIANTS
    TypeOK
    OneOwner
