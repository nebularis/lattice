\* Model A on a snapshot store that does not detect a write-write conflict.
\* Expected: NoLostUpdate is violated.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Target = tgt
    Isolation = "SnapshotNoWWDetect"
INVARIANTS
    TypeOK
    NoLostUpdate
