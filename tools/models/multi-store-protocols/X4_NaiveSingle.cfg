\* SPDX-License-Identifier: MPL-2.0
\* X4 with copy then flip, two writers of two writes, no timeouts, checking that
\* no write is acknowledged by both stores. A writer sends a write once, so no
\* write reaches both stores.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Protocol = "Naive"
    Timeouts = FALSE
    Writers = {1, 2}
    PerWriter = 2
INVARIANTS
    TypeOK
    SingleAuthority
