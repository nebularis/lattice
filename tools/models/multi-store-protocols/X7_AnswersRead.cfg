\* As X7_AnswersNoToken.cfg where the read a batch is planned from also reads its receipts, and one planning again.
\* Expected to hold.
SPECIFICATION Spec
CONSTANTS
    Guard = "WholeAnswer"
    Delivery = "Stream"
    Receipts = "Kept"
    Script = "CreateSetDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 3
    MaxCrashes = 2
    Retries = 1
INVARIANTS
    TypeOK
    AppliedOnce
    AnswersAgree
    PartitionOrder
