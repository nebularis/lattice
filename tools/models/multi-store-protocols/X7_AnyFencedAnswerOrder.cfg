\* X7 where a writer that starts takes the stream from any position, a creation, a change and a deletion, a resend, two writers, one crash.
\* Under FencedAnswer, checking the partition's order. Each command here applies only after the one before it, so no order can break. Expected to hold.
SPECIFICATION Spec
CONSTANTS
    Guard = "FencedAnswer"
    Delivery = "Any"
    Receipts = "Kept"
    Script = "CreateSetDel"
    Resend = TRUE
    Live0 = FALSE
    BatchMax = 2
    NWriters = 2
    MaxCrashes = 1
    Retries = 2
INVARIANTS
    TypeOK
    AppliedOnce
    PartitionOrder
