\* SPDX-License-Identifier: MPL-2.0
\* Model B on a snapshot store that detects no write-write conflict, two
\* writers, no bump.
\* Expected: OnePerPosition is violated.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Isolation = "SnapshotNoWW"
    Bump = FALSE
    Resend = FALSE
    Retries = 0
INVARIANTS
    TypeOK
    OnePerPosition
