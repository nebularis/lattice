\* X1 with the offset stored as the highest received, one writer at a time, one
\* crash. This is the defect of MSAI9-06.
\* Expected: EventuallyApplied is violated, and the safety invariants hold.
SPECIFICATION Spec
CONSTANTS
    K = 3
    W = 2
    MaxCrashes = 1
    Zombie = FALSE
    OffsetMode = "Received"
    WithReader = FALSE
INVARIANTS
    TypeOK
    EachAppliedOnceInEffect
    OrderPerKey
    AThenB
PROPERTIES
    EventuallyApplied
