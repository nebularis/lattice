\* SPDX-License-Identifier: MPL-2.0
\* Model C, the first write as a guarded replace of a row created at seq 0, on
\* a snapshot store where only a statement both transactions delete is a
\* conflict, three writers, a resend after a lost reply, an aborted commit
\* sent again up to twice.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Isolation = "SnapshotDeleteWW"
    FirstWrite = "PreCreatedRow"
    Resend = TRUE
    Retries = 2
INVARIANTS
    TypeOK
    OneFirstWrite
    OneHead
