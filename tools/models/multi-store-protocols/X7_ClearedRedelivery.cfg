\* SPDX-License-Identifier: MPL-2.0
\* Batches of one command where the deletion clears every receipt, with three writers and two crashes.
\* A writer that starts from an older stored offset takes a command whose receipt is gone and answers it as not applied. Expected to fail `AnswersAgree`.
SPECIFICATION Spec
CONSTANTS
    Guard = "FencedAnswer"
    Delivery = "Stream"
    Receipts = "Cleared"
    Script = "CreateSetDel"
    Resend = FALSE
    Live0 = FALSE
    BatchMax = 1
    NWriters = 3
    MaxCrashes = 2
    Retries = 3
INVARIANTS
    AppliedOnce
    AnswersAgree
    PartitionOrder
