\* X5 with one guard and no epoch, and the read a command is planned from also reading its receipt, both saves and the deletion, two writers that take the stream in order from the stored offset,
\* one crash, a refused command planned again up to twice, weak fairness on each writer's actions but its crash.
\* Checks that where the last writer to start stays alive, every command is eventually finished. Expected to hold.
SPECIFICATION FairSpec
CONSTANTS
    Guard = "WholeAnswer"
    Delivery = "Stream"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 2
    MaxCrashes = 1
    Retries = 2
INVARIANTS
    TypeOK
PROPERTIES
    EventuallyAnswered
