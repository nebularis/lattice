\* SPDX-License-Identifier: MPL-2.0
\* X2 under the BestKnown row, checking the guarantee of the row, which is that
\* an audit over the recorded read set finds every decision whose evidence
\* differs from what S held at p, and that the evaluation completes.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Row = "BestKnown"
    MaxPos = 3
    Values = {"a", "b"}
    Holder0 = "a"
    DecPositions = {1, 2, 3}
INVARIANTS
    TypeOK
    AuditFindsStale
    ReadSetTrue
PROPERTIES
    AllDecided
