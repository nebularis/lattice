    Row = "Watermark"
    MaxPos = 3
    Values = {"a", "b"}
    Holder0 = "a"
    DecPositions = {1, 2, 3}
INVARIANTS
    TypeOK
    CommitOnlyPastWatermark
    EvidenceAsOfP
    AuditFindsStale
    ReadSetTrue
PROPERTIES
    AllDecided
