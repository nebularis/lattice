\* SPDX-License-Identifier: MPL-2.0
\* X5 with one guard over every row a command writes and no epoch, an answer given without a request
\* read with the command's receipt, writers that take every command once in any order, both saves and the deletion,
\* two writers, one crash, a refused command planned again up to twice.
\* Checks the state, the answers and the patch log.
SPECIFICATION Spec
CONSTANTS
    Guard = "WholeAnswer"
    Delivery = "Any"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 2
    MaxCrashes = 1
    Retries = 2
INVARIANTS
    TypeOK
    WholeCommands
    AnswersAgree
    LogKept
