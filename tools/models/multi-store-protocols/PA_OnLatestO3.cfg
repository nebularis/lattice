\* SPDX-License-Identifier: MPL-2.0
\* Each pass one request written on whatever revision is latest, its position
\* the later of its stimulus's and the latest pass's as read, with the
\* constants of PA_OnRead.cfg, checking O3.
\* Expected: PassOrder is violated.
SPECIFICATION Spec
CONSTANTS
    Protocols = {"OnLatest"}
    Rules = {"LaterOf"}
    Others = {"Credit", "Activation"}
    Modes = {"Concurrent"}
    MaxStops = 1
    StopActors = {"A", "O"}
    Bundles = {0, 1, 2, 3}
    Quotas = {0, 1, 2}
    Orders = {"AFirst", "OFirst", "Same"}
    Stated = 3
    CreditSeats = 1
    Licences = "One"
    AlertNeedsQuota = FALSE
INVARIANTS
    PassOrder
