\* SPDX-License-Identifier: MPL-2.0
\* X4 with copy then flip, two writers of two writes, no timeouts. A write that
\* A applies after the copy is acknowledged and is not in B.
\* Expected: NoLostWrite is violated.
SPECIFICATION Spec
CONSTANTS
    Protocol = "Naive"
    Timeouts = FALSE
    Writers = {1, 2}
    PerWriter = 2
INVARIANTS
    TypeOK
    NoLostWrite
