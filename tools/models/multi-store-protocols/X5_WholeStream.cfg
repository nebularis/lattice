\* SPDX-License-Identifier: MPL-2.0
\* X5 with one guard over every row a command writes, two writers that each take
\* the stream in order, both saves and then the deletion, one crash, a refused
\* command planned again up to three times.
\* Checks the state only.
SPECIFICATION Spec
CONSTANTS
    Guard = "Whole"
    Delivery = "Stream"
    Saves = {"SaveDoc", "SaveDesc"}
    DelFirst = FALSE
    NWriters = 2
    MaxCrashes = 1
    Retries = 3
INVARIANTS
    TypeOK
    WholeCommands
