\* SPDX-License-Identifier: MPL-2.0
\* X4 with fence, copy and flip, two writers of two writes, and a writer that may
\* give up on a request and send again, which leaves requests in flight across
\* the flip.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Protocol = "Fenced"
    Timeouts = TRUE
    Writers = {1, 2}
    PerWriter = 2
INVARIANTS
    TypeOK
    NoLostWrite
    SingleAuthority
PROPERTIES
    AllAcknowledged
