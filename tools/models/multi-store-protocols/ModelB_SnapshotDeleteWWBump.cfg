\* SPDX-License-Identifier: MPL-2.0
\* Model B on a snapshot store that detects a statement both transactions
\* delete, two writers, the dataset epoch bumped once, an aborted commit sent
\* again once.
\* Expected: FencedAppends is violated.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Isolation = "SnapshotDeleteWW"
    Bump = TRUE
    Resend = FALSE
    Retries = 1
INVARIANTS
    TypeOK
    FencedAppends
