\* SPDX-License-Identifier: MPL-2.0
\* Model C, create-if-absent on a snapshot store where inserting an identical
\* statement is a write-write conflict, three writers, a resend after a lost
\* reply, an aborted commit sent again up to twice.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Isolation = "SnapshotInsertWW"
    FirstWrite = "AbsentRow"
    Resend = TRUE
    Retries = 2
INVARIANTS
    TypeOK
    OneFirstWrite
    OneHead
