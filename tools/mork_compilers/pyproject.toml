[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mork-compilers"
version = "0.1.0"
description = "MORK executable backend compiler family"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rdflib>=7.0,<8",
]

[tool.setuptools.packages.find]
where = ["src"]
