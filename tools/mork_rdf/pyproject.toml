[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-mork-rdf"
version = "0.1.0"
description = "MORK structure mappings between RDF vocabularies, compiled to SPARQL 1.1 CONSTRUCT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "rdflib>=7.0,<8",
  "pyshacl>=0.26,<1",
  "pyoxigraph>=0.5,<0.6",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
