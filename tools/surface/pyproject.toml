[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-surface-compiler"
version = "0.2.0"
description = "Reference implementation of the LATTICE surface compiler"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "rdflib>=7.0,<8",
  "lattice-vocabulary-resolver>=0.1,<0.2",
]

[project.scripts]
surface = "surface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
