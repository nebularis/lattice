[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-persistence-compiler"
version = "0.1.0"
description = "Design-time compiler for the LATTICE persistence profile substrate (ontology/persistence)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "rdflib>=7.0,<8",
  "chevron>=0.14,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pyshacl>=0.25",
  "jsonschema>=4.20",
]

[project.scripts]
persistence = "persistence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
persistence = ["templates/*.mustache"]
